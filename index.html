<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TOUCHLINE | 축구 선수 훈련 관리</title>

  <style>
    /* ======================================
       기본 디자인
    ====================================== */

    :root {
      --bg: #0c1118;
      --sidebar: #101721;
      --panel: #151e29;
      --input: #0f1721;
      --line: #2b3848;
      --text: #eef3f8;
      --muted: #b1bfce;
      --accent: #c9f36b;
      --danger: #ffd8df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #15200b;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .secondary {
      background: #263445;
      color: var(--text);
    }

    .danger {
      background: #472a33;
      color: var(--danger);
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      padding: 11px;
      border: 1px solid #405167;
      border-radius: 7px;
      background: var(--input);
      color: var(--text);
    }

    textarea {
      min-height: 100px;
      line-height: 1.7;
      resize: vertical;
    }

    input[type="file"] {
      font-size: 12px;
    }

    h1,
    h2,
    h3,
    p {
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -1.5px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .muted {
      color: var(--muted);
      line-height: 1.8;
    }

    .tiny {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    /* ======================================
       사이드바 / 상단
    ====================================== */

    aside {
      position: fixed;
      inset: 0 auto 0 0;
      width: 230px;
      padding: 30px 18px;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--accent);
    }

    .brand-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
    }

    nav {
      display: grid;
      gap: 7px;
      margin-top: 38px;
    }

    nav button {
      padding: 14px 12px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      white-space: nowrap;
    }

    nav button.active {
      background: #233126;
      color: var(--accent);
    }

    .nav-number {
      margin-right: 13px;
      opacity: .5;
      font-size: 11px;
    }

    .sidebar-bottom {
      margin-top: auto;
      color: var(--muted);
      font-size: 10px;
      line-height: 2;
    }

    main {
      max-width: 1800px;
      margin-left: 230px;
      padding: 28px 36px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero {
      padding: 30px 0 22px;
    }

    footer {
      margin-top: 32px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    /* ======================================
       공통 카드 / 폼
    ====================================== */

    .card {
      min-width: 0;
      padding: 23px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-number {
      margin: 12px 0 6px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stat-unit {
      margin-left: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 5px;
      background: #263927;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-title {
      margin-bottom: 5px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .notice {
      margin: 18px 0;
      padding: 13px 16px;
      border-left: 3px solid var(--accent);
      background: #19251f;
      color: #d8e7d4;
      font-size: 12px;
      line-height: 1.8;
    }

    .empty {
      padding: 22px 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 500;
    }

    /* ======================================
       월간 스케줄 표
    ====================================== */

    .calendar-card {
      margin-bottom: 22px;
      padding: 26px;
      background: var(--panel);
    }

    .calendar-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .calendar-heading {
      margin: 8px 0 0;
      font-size: 27px;
      letter-spacing: -1px;
    }

    .calendar-scroll {
      overflow-x: auto;
    }

    .calendar-week,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      min-width: 680px;
    }

    .calendar-week > div {
      padding: 15px 5px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .calendar-grid {
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .calendar-cell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      min-width: 0;
      min-height: 155px;
      padding: 8px;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: var(--panel);
      color: var(--text);
      font-weight: 400;
      text-align: left;
    }

    button.calendar-cell:hover {
      background: #1c2937;
      filter: none;
    }

    .calendar-cell.blank {
      background: var(--bg);
    }

    .calendar-cell.selected {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .day-number {
      display: grid;
      place-items: center;
      align-self: flex-end;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      font-size: 17px;
      font-weight: 600;
    }

    .day-number.today {
      border-radius: 50%;
      background: var(--accent);
      color: #15200b;
      font-weight: 900;
    }

    .calendar-event {
      display: block;
      overflow: hidden;
      padding: 7px 6px;
      border: 1px solid #35485e;
      border-radius: 6px;
      background: #213044;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-event.completed {
      border-color: #3b5336;
      background: #263927;
      color: var(--accent);
    }

    .journal-mark {
      padding: 3px 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .calendar-legend {
      margin: 14px 0 0;
    }

    .daily-heading {
      margin: 10px 0 20px;
    }

    summary {
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    details {
      margin-top: 18px;
    }

    details form {
      margin-top: 20px;
    }

    /* ======================================
       영상 / 반응 훈련
    ====================================== */

    video {
      display: block;
      width: 100%;
      max-height: 440px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #080c11;
    }

    .reaction-button {
      width: 100%;
      min-height: 170px;
      margin: 16px 0;
      background: #263445;
      color: var(--text);
      font-size: 23px;
    }

    .reaction-button.ready {
      background: var(--accent);
      color: #15200b;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      max-width: calc(100vw - 44px);
      padding: 14px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #15200b;
      font-weight: 700;
      box-shadow: 0 10px 30px #0005;
    }

    /* ======================================
       모바일
    ====================================== */

    @media (max-width: 1100px) {
      aside {
        width: 195px;
      }

      main {
        margin-left: 195px;
        padding: 24px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      aside {
        position: static;
        width: auto;
        padding: 20px 16px;
      }

      nav {
        display: flex;
        overflow-x: auto;
        margin-top: 20px;
      }

      nav button {
        flex-shrink: 0;
      }

      .sidebar-bottom {
        display: none;
      }

      main {
        margin-left: 0;
        padding: 18px;
      }

      header {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .card,
      .calendar-card {
        padding: 18px;
      }

      .calendar-cell {
        min-height: 135px;
      }

      .row {
        flex-wrap: wrap;
      }

      .stat-number {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <aside>
    <div class="brand">TOUCH<span>LINE</span></div>
    <div class="brand-sub">PLAYER PERFORMANCE SYSTEM</div>

    <nav id="navigation" aria-label="메인 메뉴"></nav>

    <div class="sidebar-bottom">
      PERSONAL WORKSPACE<br>
      TRAIN · RECOVER · DEVELOP<br>
      LOCAL STORAGE · NO CLOUD SYNC
    </div>
  </aside>

  <main>
    <header>
      <div>
        <div class="eyebrow">PERFORMANCE LAB</div>
        <div class="tiny" id="currentDate"></div>
      </div>

      <div class="actions">
        <button id="exportButton" class="secondary"></button>
        <button id="importButton" class="secondary"></button>
        <button id="languageButton" class="secondary">EN</button>

        <input
          id="importFile"
          type="file"
          accept=".json,application/json"
          hidden
        >
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow" id="sectionLabel"></div>
      <h1 id="pageTitle"></h1>
      <p class="muted" id="pageDescription"></p>
    </section>

    <div id="content"></div>

    <footer id="footer"></footer>
  </main>

  <div id="notification" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /* ======================================
       기본 설정 / 저장
    ====================================== */

    const STORAGE_KEY = "touchline-v1";
    const $ = id => document.getElementById(id);

    let language = "ko";
    let currentPage = "overview";
    let storageAvailable = true;
    let notificationTimer = null;

    let journalDirty = false;

    let reactionTimer = null;
    let reactionPhase = "idle";
    let reactionStarted = 0;

    let videoURL = null;
    let videoFilename = "";
    let videoPosition = 0;

    const now = new Date();

    let calendarYear = now.getFullYear();
    let calendarMonth = now.getMonth();
    let selectedDate = localDate(now);

    const pageNames = {
      overview: ["대시보드", "Overview"],
      schedule: ["훈련 일정 · 일지", "Schedule & journal"],
      matches: ["경기 기록", "Match records"],
      recovery: ["회복 관리", "Recovery"],
      programs: ["훈련 프로그램", "Programs"],
      growth: ["성장 분석", "Progress"],
      brain: ["인지·반응 훈련", "Cognitive training"],
      video: ["영상 분석", "Video review"]
    };

    function translate(ko, en) {
      return language === "ko" ? ko : en;
    }

    function localDate(d = new Date()) {
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
      ].join("-");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function uniqueID() {
      return globalThis.crypto?.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "-" + Math.random().toString(36).slice(2);
    }

    function emptyDatabase() {
      return {
        version: 1,
        sessions: [],
        matches: [],
        recovery: [],
        journals: [],
        tags: [],
        reactions: []
      };
    }

    function isNumber(value, min, max) {
      return (
        Number.isFinite(value) &&
        value >= min &&
        value <= max
      );
    }

    function isDate(value) {
      if (
        typeof value !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(value)
      ) {
        return false;
      }

      const parsed = new Date(value + "T12:00:00");

      return (
        !Number.isNaN(parsed.getTime()) &&
        localDate(parsed) === value
      );
    }

    function validDatabase(data) {
      if (!data || data.version !== 1) return false;

      const collections = [
        "sessions",
        "matches",
        "recovery",
        "tags",
        "reactions"
      ];

      if (!collections.every(key => Array.isArray(data[key]))) {
        return false;
      }

      if (!data.sessions.every(item =>
        item &&
        typeof item.id === "string" &&
        typeof item.name === "string" &&
        isDate(item.date) &&
        isNumber(item.minutes, 0, 600) &&
        isNumber(item.rpe, 1, 10) &&
        typeof item.done === "boolean"
      )) return false;

      if (!data.matches.every(item =>
        item &&
        typeof item.id === "string" &&
        typeof item.opponent === "string" &&
        isDate(item.date) &&
        ["minutes", "goals", "assists"].every(
          key => isNumber(item[key], 0, 999)
        )
      )) return false;

      if (!data.recovery.every(item =>
        item &&
        typeof item.id === "string" &&
        isDate(item.date) &&
        isNumber(item.sleep, 0, 24) &&
        isNumber(item.fatigue, 0, 10) &&
        isNumber(item.pain, 0, 10)
      )) return false;

      if (!data.tags.every(item =>
        item &&
        typeof item.id === "string" &&
        typeof item.file === "string" &&
        typeof item.note === "string" &&
        isNumber(item.time, 0, Number.MAX_SAFE_INTEGER)
      )) return false;

      if (!data.reactions.every(item =>
        item &&
        typeof item.date === "string" &&
        isNumber(item.ms, 0, Number.MAX_SAFE_INTEGER)
      )) return false;

      if (
        data.journals !== undefined &&
        (
          !Array.isArray(data.journals) ||
          !data.journals.every(item =>
            item &&
            isDate(item.date) &&
            typeof item.goal === "string" &&
            typeof item.body === "string" &&
            typeof item.next === "string" &&
            ["great", "normal", "tired"].includes(item.mood)
          )
        )
      ) return false;

      return true;
    }

    let database = emptyDatabase();

    try {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {
        const parsed = JSON.parse(saved);

        if (validDatabase(parsed)) {
          database = {
            ...parsed,
            journals: parsed.journals || []
          };
        } else {
          storageAvailable = false;
        }
      }

      language = (
        localStorage.getItem(STORAGE_KEY + "-lang") === "en"
          ? "en"
          : "ko"
      );
    } catch (error) {
      storageAvailable = false;
    }

    function notify(message) {
      clearTimeout(notificationTimer);

      $("notification").className = "toast";
      $("notification").textContent = message;

      notificationTimer = setTimeout(() => {
        $("notification").className = "";
        $("notification").textContent = "";
      }, 3500);
    }

    function persist() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(database)
        );

        storageAvailable = true;
        return true;
      } catch (error) {
        storageAvailable = false;

        notify(translate(
          "저장하지 못했습니다. 백업 내보내기로 기록을 보관하세요.",
          "Storage failed. Export a backup to keep your records."
        ));

        return false;
      }
    }

    function confirmLeaving() {
      return (
        !journalDirty ||
        confirm(translate(
          "저장하지 않은 일지가 있습니다. 저장하지 않고 이동할까요?",
          "You have unsaved journal changes. Leave without saving?"
        ))
      );
    }

    /* ======================================
       공통 UI
    ====================================== */

    function field(label, name, type = "text", attributes = "") {
      return `
        <label class="field">
          ${label}
          <input
            name="${name}"
            type="${type}"
            ${attributes}
            required
          >
        </label>
      `;
    }

    function emptyMessage() {
      return `
        <div class="empty">
          ${translate(
            "아직 기록이 없습니다. 첫 기록을 추가해 보세요.",
            "No records yet. Add your first entry."
          )}
        </div>
      `;
    }

    function statistic(label, value, unit = "") {
      return `
        <div class="card">
          <div class="tiny">${label}</div>

          <div class="stat-number">
            ${value}
            <span class="stat-unit">${unit}</span>
          </div>

          <div class="tiny">
            ${translate(
              "직접 입력한 기록 기준",
              "Based on your entries"
            )}
          </div>
        </div>
      `;
    }

    function deleteButton(collection, id) {
      return `
        <button
          type="button"
          class="danger"
          data-delete="${collection}"
          data-id="${escapeHTML(id)}"
        >
          ${translate("삭제", "Delete")}
        </button>
      `;
    }

    function total(rows, key) {
      return rows.reduce((sum, row) => sum + row[key], 0);
    }

    function completedSessions() {
      return database.sessions.filter(session => session.done);
    }

    function sessionRow(session) {
      return `
        <div class="row">
          <div>
            <div class="row-title">
              ${escapeHTML(session.name)}
            </div>

            <div class="tiny">
              ${escapeHTML(session.date)}
              · ${session.minutes} min
              · RPE ${session.rpe}
            </div>
          </div>

          <div class="actions">
            <button
              type="button"
              class="secondary"
              data-complete="${escapeHTML(session.id)}"
            >
              ${
                session.done
                  ? translate("완료 취소", "Undo")
                  : translate("완료 처리", "Mark done")
              }
            </button>

            ${deleteButton("sessions", session.id)}
          </div>
        </div>
      `;
    }

    function sessionForm(day) {
      return `
        <form id="sessionForm">
          ${field(
            translate("훈련 이름", "Session name"),
            "name",
            "text",
            'maxlength="100"'
          )}

          ${field(
            translate("날짜", "Date"),
            "date",
            "date",
            `value="${day}"`
          )}

          ${field(
            translate("훈련 시간 (분)", "Duration (minutes)"),
            "minutes",
            "number",
            'min="1" max="600" step="1" value="60"'
          )}

          ${field(
            translate(
              "운동자각도 RPE (1–10)",
              "Perceived exertion RPE (1–10)"
            ),
            "rpe",
            "number",
            'min="1" max="10" step="1" value="5"'
          )}

          <button type="submit">
            ${translate("일정 추가", "Add session")}
          </button>

          <p class="tiny">
            ${translate(
              "실제 시간·강도가 계획과 달랐다면 기존 항목을 삭제하고 실제 값으로 다시 입력하세요.",
              "If actual duration or effort differs, delete the entry and re-enter the actual values."
            )}
          </p>
        </form>
      `;
    }

        "Personal player management tool · Records stay in this browser. Export backups regularly. No medical diagnosis or automated AI video analysis."

      const screens = {
        overview: overviewScreen,
        schedule: scheduleScreen,
        matches: matchesScreen,
        recovery: recoveryScreen,
        programs: programsScreen,
        growth: growthScreen,
        brain: brainScreen,
        video: videoScreen

            ${translate(

              "Browser storage is unavailable or existing data could not be validated. Back up your records."

    /* ======================================

    function scheduleScreen() {
      const firstWeekday =
        new Date(calendarYear, calendarMonth, 1).getDay();

      const daysInMonth =
        new Date(calendarYear, calendarMonth + 1, 0).getDate();

      const monthTitle =
        new Date(calendarYear, calendarMonth, 1)
          .toLocaleDateString(
            language === "ko" ? "ko-KR" : "en-GB",
            { year: "numeric", month: "long" }
          );

      const weekdays = translate(
        "일,월,화,수,목,금,토",
        "Sun,Mon,Tue,Wed,Thu,Fri,Sat"
      ).split(",");

      let cells = "";

      for (let index = 0; index < firstWeekday; index++) {
        cells += `
          <div
            class="calendar-cell blank"
            aria-hidden="true"
          ></div>
        `;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayKey = localDate(
          new Date(calendarYear, calendarMonth, day)
        );

        const sessions = database.sessions.filter(
          item => item.date === dayKey
        );

        const hasJournal = database.journals.some(
          item => item.date === dayKey
        );

        cells += `
          <button
            type="button"
            class="calendar-cell ${
              selectedDate === dayKey ? "selected" : ""
            }"
            data-date="${dayKey}"
            aria-pressed="${selectedDate === dayKey}"
            aria-label="${dayKey}, ${sessions.length} ${
              translate("훈련", "sessions")
            }"
          >
            <span class="day-number ${
              dayKey === localDate() ? "today" : ""
            }">
              ${day}
            </span>

            ${sessions.slice(0, 3).map(session => `
              <span
                class="calendar-event ${
                  session.done ? "completed" : ""
                }"
                title="${escapeHTML(session.name)}"
              >
                ${session.done ? "✓ " : ""}
                ${escapeHTML(session.name)}
              </span>
            `).join("")}

            ${
              sessions.length > 3
                ? `
                  <span class="tiny">
                    +${sessions.length - 3}
                  </span>
                `
                : ""
            }

            ${
              hasJournal
                ? `
                  <span class="journal-mark">
                    ✎ ${translate("일지", "Journal")}
                  </span>
                `
                : ""
            }
          </button>
        `;
      }

      const trailingCells =
        (7 - ((firstWeekday + daysInMonth) % 7)) % 7;

      for (let index = 0; index < trailingCells; index++) {
        cells += `
          <div
            class="calendar-cell blank"
            aria-hidden="true"
          ></div>
        `;

        item => item.date === selectedDate

          <p class="tiny">

            <div class="calendar-grid">
              ${cells}

          </div>

          <p class="tiny calendar-legend">
            ${translate(

              <div class="actions">

                ${

          </section>
        </div>
      `;
    }

    /* ======================================
       6. 성장 분석
    ====================================== */

    function growthScreen() {
      const completed = completedSessions();
      const periods = [];

      for (let index = 3; index >= 0; index--) {
        const end = new Date();
        end.setHours(12, 0, 0, 0);
        end.setDate(end.getDate() - index * 7);

        const start = new Date(end);
        start.setDate(start.getDate() - 6);

        const from = localDate(start);
        const to = localDate(end);

        const records = completed.filter(
          item => item.date >= from && item.date <= to
        );

        periods.push({
          from,
          to,
          count: records.length,
          minutes: total(records, "minutes"),
          load: records.reduce(
            (sum, item) => sum + item.minutes * item.rpe,
            0
          )
        });
      }

      return `
        <div class="stats">
          ${statistic(
            translate("완료 훈련", "Completed sessions"),
            completed.length
          )}

          ${statistic(
            translate("누적 훈련", "Total training"),
            total(completed, "minutes"),
            "min"
          )}

          ${statistic(
            translate("누적 득점", "Total goals"),
            total(database.matches, "goals")
          )}

          ${statistic(
            translate("누적 도움", "Total assists"),
            total(database.matches, "assists")
          )}
        </div>

          <h2>${translate("최근 4주 훈련 요약", "Last four weeks")}</h2>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">${translate("기간", "Period")}</th>
                  <th scope="col">
                    ${translate("완료 수", "Sessions")}
                  </th>
                  <th scope="col">
                    ${translate("시간(분)", "Minutes")}
                  </th>
                  <th scope="col">
                    ${translate("주관적 부하(AU)", "Subjective load (AU)")}
                  </th>
                </tr>
              </thead>

              <tbody>
                ${periods.map(period => `
                  <tr>
                    <td>${period.from} — ${period.to}</td>
                    <td>${period.count}</td>
                    <td>${period.minutes}</td>
                    <td>${period.load}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>

          <div class="notice">
            ${translate(
              "부하 = 완료 훈련 시간(분) × 입력 RPE의 합입니다. 각 행은 오늘을 기준으로 나눈 7일 구간입니다. 훈련량 요약이며 실력 향상이나 부상 위험을 판정하지 않습니다.",
              "Load = sum of completed session minutes × entered RPE. Each row is a rolling seven-day window ending today. This describes volume, not skill improvement or injury risk."
            )}
          </div>
        </section>
      `;
    }

    /* ======================================
       7. 인지 / 반응 훈련
    ====================================== */

    function brainScreen() {
      return `
        <div class="grid">
          <section class="card">
            <div class="eyebrow">REACTION LAB</div>

            <h2 style="margin-top:14px">
              ${translate("시각 반응 연습", "Visual reaction practice")}
            </h2>

            <p class="muted">
              ${translate(
                "시작을 누르고 기다리세요. 버튼이 연두색으로 바뀌면 클릭하세요.",
                "Press Start and wait. Tap when the button turns lime."
              )}
            </p>

            <button
              type="button"
              id="reactionButton"
              class="reaction-button"
            >
              ${translate("시작", "Start")}
            </button>

            <p id="reactionResult" class="muted" aria-live="polite"></p>

            <div class="notice">
              ${translate(
                "화면·브라우저·입력 장치 지연이 포함된 연습용 측정입니다. 뇌 기능 검사나 축구 실력 평가가 아니며 경기력 향상을 보장하지 않습니다.",
                "Practice timing includes display, browser and input latency. This is not a brain-function test or football assessment and does not guarantee performance improvement."
              )}
            </div>
          </section>

          <section class="card">
            <h2>${translate("인지 훈련 아이디어", "Cognitive practice ideas")}</h2>

            <p class="muted">
              ${translate(
                "패스 전 주변 확인, 파트너의 신호에 따른 방향 선택 등 시각 탐색과 선택 반응을 실제 축구 동작에 연결해 연습하세요. 난도와 강도는 코치와 조정하세요.",
                "Connect visual search and choice responses to football actions: scan before passing and choose directions from partner cues. Adjust difficulty and intensity with a coach."
              )}
            </p>

            <h3>${translate("최근 반응 기록", "Recent reaction times")}</h3>

            ${
              database.reactions.slice(-8).reverse().map(record => `
                <div class="row">
                  <span class="tiny">
                    ${escapeHTML(
                      new Date(record.date).toLocaleString(
                        language === "ko" ? "ko-KR" : "en-GB"
                      )
                    )}
                  </span>

                  <strong>${record.ms} ms</strong>
                </div>
              `).join("") || emptyMessage()
            }
          </section>
        </div>
      `;
    }

    /* ======================================
       8. 영상 리뷰
    ====================================== */

    function videoScreen() {
      return `
        <div class="grid">
          <section class="card">
            <h2>${translate("내 영상 불러오기", "Open your video")}</h2>

            <label class="field">
              ${translate("기기 내 영상 파일", "Local video file")}

              <input id="videoFile" type="file" accept="video/*">
            </label>

            <p class="tiny" id="videoFilename">
              ${escapeHTML(videoFilename)}
            </p>

            <video id="videoPlayer" controls playsinline></video>

            <label class="field">
              ${translate("현재 장면 메모", "Note for current scene")}

              <textarea
                id="videoNote"
                maxlength="1000"
                placeholder="${translate(
                  "예: 공 받기 전 주변 확인",
                  "Example: scan before receiving"
                )}"
              ></textarea>
            </label>

            <button type="button" id="saveVideoTag">
              ${translate("현재 시점 태그 저장", "Tag current time")}
            </button>

            <div class="notice">
              ${translate(
                "수동 영상 리뷰 기능입니다. 선수 추적·자세 인식·자동 AI 분석은 제공하지 않습니다. 영상은 업로드되지 않으며 파일명·시간·메모만 저장됩니다. 새로고침 후 영상은 다시 선택해야 합니다.",
                "Manual review only: no tracking, pose recognition or automated AI analysis. Video is not uploaded. Only filename, time and notes are saved. Select your video again after refresh."
              )}
            </div>
          </section>

          <section class="card">
            <h2>${translate("장면 태그", "Scene tags")}</h2>

            ${
              database.tags.map(tag => `
                <div class="row">
                  <div>
                    <div class="row-title">
                      ${escapeHTML(tag.note)}
                    </div>

                    <div class="tiny">
                      ${escapeHTML(tag.file)}
                      · ${Math.floor(tag.time / 60)}:${
                        String(Math.floor(tag.time % 60)).padStart(2, "0")
                      }
                    </div>
                  </div>

                  <div class="actions">
                    <button
                      type="button"
                      class="secondary"
                      data-seek="${escapeHTML(tag.id)}"
                    >
                      ${translate("이동", "Seek")}
                    </button>

                    ${deleteButton("tags", tag.id)}
                  </div>
                </div>
              `).join("") || emptyMessage()
            }
          </section>
        </div>
      `;
    }

    /* ======================================
       화면 이벤트
    ====================================== */

    function bindEvents() {
      // 메뉴 이동
      document.querySelectorAll("[data-page]").forEach(button => {
        button.onclick = () => {
          if (!confirmLeaving()) return;

          currentPage = button.dataset.page;
          render();
          window.scrollTo(0, 0);
        };
      });

      // 기록 삭제
      document.querySelectorAll("[data-delete]").forEach(button => {
        button.onclick = () => {
          if (!confirmLeaving()) return;

          if (!confirm(translate(
            "이 기록을 삭제할까요?",
            "Delete this entry?"
          ))) return;

          const collection = button.dataset.delete;

          database[collection] = database[collection].filter(
            item => item.id !== button.dataset.id
          );

          persist();
          render();
        };
      });

      // 훈련 완료 / 취소
      document.querySelectorAll("[data-complete]").forEach(button => {
        button.onclick = () => {
          if (!confirmLeaving()) return;

          const session = database.sessions.find(
            item => item.id === button.dataset.complete
          );

          if (!session) return;

          session.done = !session.done;

          persist();
          render();
        };
      });

      bindRecordForms();
      bindCalendar();
      bindPrograms();
      bindReaction();
      bindVideo();
    }

    /* ======================================
       훈련 / 경기 / 회복 입력
    ====================================== */

    function bindRecordForms() {
      const definitions = [
        ["sessionForm", "sessions", ["minutes", "rpe"]],
        ["matchForm", "matches", ["minutes", "goals", "assists"]],
        ["recoveryForm", "recovery", ["sleep", "fatigue", "pain"]]
      ];

      definitions.forEach(([id, collection, numericFields]) => {
        const form = $(id);

        if (!form) return;

        form.onsubmit = event => {
          event.preventDefault();

          if (!confirmLeaving()) return;

          const entry = Object.fromEntries(new FormData(form));

          if (!isDate(entry.date)) {
            notify(translate(
              "올바른 날짜를 입력하세요.",
              "Enter a valid date."
            ));
            return;
          }

          for (const key of numericFields) {
            entry[key] = Number(entry[key]);
          }

          entry.id = uniqueID();

          if (collection === "sessions") {
            entry.name = entry.name.trim();
            entry.done = false;

            if (!entry.name) return;
          }

          if (collection === "matches") {
            entry.opponent = entry.opponent.trim();

            if (!entry.opponent) return;
          }

          if (collection === "recovery") {
            const exists = database.recovery.some(
              item => item.date === entry.date
            );

            if (
              exists &&
              !confirm(translate(
                "같은 날짜의 회복 기록을 교체할까요?",
                "Replace the recovery entry for this date?"
              ))
            ) return;

            database.recovery = database.recovery.filter(
              item => item.date !== entry.date
            );
          }

          database[collection].push(entry);

          const saved = persist();

          render();

          if (saved) {
            notify(translate("저장했습니다.", "Saved."));
          }
        };
      });
    }

    /* ======================================
       달력 / 일지 이벤트
    ====================================== */

    function bindCalendar() {
      if (currentPage !== "schedule") return;

      function changeMonth(offset) {
        if (!confirmLeaving()) return;

        const target = new Date(
          calendarYear,
          calendarMonth + offset,
          1
        );

        calendarYear = target.getFullYear();
        calendarMonth = target.getMonth();

        render();
      }

      $("previousMonth").onclick = () => changeMonth(-1);
      $("nextMonth").onclick = () => changeMonth(1);

      $("todayButton").onclick = () => {
        if (!confirmLeaving()) return;

        const today = new Date();

        calendarYear = today.getFullYear();
        calendarMonth = today.getMonth();
        selectedDate = localDate(today);

        render();
      };

      document.querySelectorAll("[data-date]").forEach(button => {
        button.onclick = () => {
          if (!confirmLeaving()) return;

          selectedDate = button.dataset.date;
          render();
        };
      });

      const form = $("journalForm");

      form.addEventListener("input", () => {
        journalDirty = true;
      });

      form.addEventListener("change", () => {
        journalDirty = true;
      });

      form.onsubmit = event => {
        event.preventDefault();

        const entry = Object.fromEntries(new FormData(form));

        entry.body = entry.body.trim();

        if (!entry.body) {
          notify(translate(
            "훈련 내용이나 느낀 점을 입력해 주세요.",
            "Please enter your training notes."
          ));
          return;
        }

        entry.date = selectedDate;
        entry.updatedAt = new Date().toISOString();

        database.journals = database.journals.filter(
          item => item.date !== selectedDate
        );

        database.journals.push(entry);

        const saved = persist();

        if (saved) {
          journalDirty = false;
          render();

          notify(translate(
            "훈련 일지를 저장했습니다.",
            "Training journal saved."
          ));
        }
      };

      if ($("deleteJournal")) {
        $("deleteJournal").onclick = () => {
          if (!confirm(translate(
            "이 날짜의 일지를 삭제할까요?",
            "Delete this date's journal?"
          ))) return;

          database.journals = database.journals.filter(
            item => item.date !== selectedDate
          );

          persist();
          journalDirty = false;
          render();
        };
      }
    }

    /* ======================================
       프로그램 이벤트
    ====================================== */

    function bindPrograms() {
      document.querySelectorAll("[data-plan]").forEach(button => {
        button.onclick = () => {
          const plan = trainingPlans[Number(button.dataset.plan)];

          database.sessions.push({
            id: uniqueID(),
            date: localDate(),
            name: translate(plan.ko, plan.en),
            minutes: plan.minutes,
            rpe: plan.rpe,
            done: false
          });

          if (persist()) {
            notify(translate(
              "오늘 일정에 추가했습니다.",
              "Added to today's schedule."
            ));
          }
        };
      });
    }

    /* ======================================
       반응 연습 이벤트
    ====================================== */

    function bindReaction() {
      const button = $("reactionButton");

      if (!button) return;

      button.onclick = () => {
        if (reactionPhase === "idle") {
          reactionPhase = "waiting";

          button.classList.remove("ready");
          button.textContent = translate("기다리세요…", "Wait…");

          reactionTimer = setTimeout(() => {
            reactionPhase = "ready";
            reactionStarted = performance.now();

            button.classList.add("ready");
            button.textContent = translate("지금 클릭!", "Tap now!");
          }, 1500 + Math.random() * 3000);

          return;
        }

        if (reactionPhase === "waiting") {
          clearTimeout(reactionTimer);
          reactionPhase = "idle";

          button.textContent = translate(
            "너무 빨라요! 다시 시작",
            "Too soon! Restart"
          );

          return;
        }

        const milliseconds = Math.round(
          performance.now() - reactionStarted
        );

        database.reactions.push({
          date: new Date().toISOString(),
          ms: milliseconds
        });

        persist();
        render();

        $("reactionResult").textContent = milliseconds + " ms";
      };
    }

    /* ======================================
       영상 이벤트
    ====================================== */

    function bindVideo() {
      const player = $("videoPlayer");

      if (!player) return;

      if (videoURL) {
        player.src = videoURL;

        player.addEventListener("loadedmetadata", () => {
          if (Number.isFinite(player.duration)) {
            player.currentTime = Math.min(
              videoPosition,
              player.duration
            );
          }
        }, { once: true });
      }

      player.addEventListener("error", () => {
        notify(translate(
          "이 영상 형식을 재생할 수 없습니다. 브라우저에서 지원하는 파일을 선택하세요.",
          "This video cannot be played. Choose a browser-supported format."
        ));
      });

      $("videoFile").onchange = event => {
        const file = event.target.files[0];

        if (!file) return;

        if (videoURL) {
          URL.revokeObjectURL(videoURL);
        }

        videoURL = URL.createObjectURL(file);
        videoFilename = file.name;
        videoPosition = 0;

        player.src = videoURL;
        $("videoFilename").textContent = videoFilename;
      };

      $("saveVideoTag").onclick = () => {
        const note = $("videoNote").value.trim();

        if (!videoFilename || player.readyState < 1 || !note) {
          notify(translate(
            "영상을 불러온 뒤 메모를 입력하세요.",
            "Load a video and enter a note."
          ));
          return;
        }

        database.tags.push({
          id: uniqueID(),
          file: videoFilename,
          time: player.currentTime,
          note
        });

        persist();
        render();
      };

      document.querySelectorAll("[data-seek]").forEach(button => {
        button.onclick = () => {
          const tag = database.tags.find(
            item => item.id === button.dataset.seek
          );

          if (
            !tag ||
            videoFilename !== tag.file ||
            player.readyState < 1
          ) {
            notify(translate(
              "해당 영상 파일을 먼저 선택하세요. 파일명만 비교하므로 같은 이름의 다른 영상에 주의하세요.",
              "Select the matching video first. Matching uses filenames only."
            ));
            return;
          }

          player.currentTime = Math.min(
            tag.time,
            Number.isFinite(player.duration)
              ? player.duration
              : tag.time
          );
        };
      });
    }

    /* ======================================
       언어 전환
    ====================================== */

    $("languageButton").onclick = () => {
      if (!confirmLeaving()) return;

      language = language === "ko" ? "en" : "ko";

      try {
        localStorage.setItem(
          STORAGE_KEY + "-lang",
          language
        );
      } catch (error) {
        // 저장되지 않아도 현재 화면의 언어는 변경됩니다.
      }

      render();
    };

    /* ======================================
       백업 내보내기
    ====================================== */

    $("exportButton").onclick = () => {
      const blob = new Blob(
        [JSON.stringify(database, null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = `touchline-backup-${localDate()}.json`;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);

      if (journalDirty) {
        notify(translate(
          "백업에는 저장한 기록만 포함됩니다. 작성 중인 일지는 별도로 저장해 주세요.",
          "Backup includes saved entries only. Save your current journal separately."
        ));
      }
    };

    /* ======================================
       백업 가져오기
    ====================================== */

    $("importButton").onclick = () => {
      if (!confirmLeaving()) return;

      $("importFile").click();
    };

    $("importFile").onchange = async event => {
      const file = event.target.files[0];

      if (!file) return;

      try {
        if (file.size > 5_000_000) {
          throw new Error("File too large");
        }

        const imported = JSON.parse(await file.text());

        if (!validDatabase(imported)) {
          throw new Error("Invalid backup");
        }

        const confirmed = confirm(translate(
          "현재 기록 전체를 백업 파일로 교체할까요? 먼저 기존 기록을 내보내 두세요.",
          "Replace ALL current records with this backup? Export your existing records first."
        ));

        if (!confirmed) return;

        database = {
          ...imported,
          journals: imported.journals || []
        };

        const saved = persist();

        render();

        if (saved) {
          notify(translate(
            "백업을 가져왔습니다.",
            "Backup imported."
          ));
        }
      } catch (error) {
        notify(translate(
          "올바른 TOUCHLINE 백업 파일이 아닙니다. JSON 파일을 확인하세요.",
          "Invalid TOUCHLINE backup. Please check the JSON file."
        ));
      } finally {
        event.target.value = "";
      }
    };

    /* ======================================
       작성 중인 일지 보호
    ====================================== */

    window.addEventListener("beforeunload", event => {
      if (journalDirty) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    // 첫 화면
    render();
  </script>
</body>
</html>
