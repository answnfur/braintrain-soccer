<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOUCHLINE · Player Workspace</title>

<style>
:root {
  --bg:#0c1118;
  --panel:#151e29;
  --line:#2b3848;
  --text:#eef3f8;
  --muted:#aebdcc;
  --accent:#c9f36b;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px system-ui,"Apple SD Gothic Neo",sans-serif;
}

button,input,select,textarea { font:inherit; }

button {
  border:0;
  border-radius:7px;
  padding:10px 14px;
  background:var(--accent);
  color:#17230c;
  cursor:pointer;
  font-weight:700;
}

button:hover { filter:brightness(1.08); }

button:focus-visible,
summary:focus-visible {
  outline:2px solid white;
  outline-offset:3px;
}

.secondary { background:#263445;color:var(--text); }
.danger { background:#452b35;color:#ffd5df; }

aside {
  position:fixed;
  inset:0 auto 0 0;
  width:210px;
  padding:28px 16px;
  background:#101721;
  border-right:1px solid var(--line);
}

.brand { font-size:23px;font-weight:900;letter-spacing:-1px; }
.brand span { color:var(--accent); }
.brand-sub { margin-top:6px;font-size:10px;color:var(--muted); }

nav { display:grid;gap:7px;margin-top:32px; }
nav button { text-align:left;background:transparent;color:var(--muted); }
nav .active { background:#253329;color:var(--accent); }

main { margin-left:210px;padding:26px 30px; }

header,.toolbar,.actions,.record {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

header,.toolbar { justify-content:space-between; }

header {
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}

h1 { margin:28px 0 8px;font-size:32px; }
h2 { margin:0 0 16px;font-size:19px; }
h3 { font-size:16px; }

.eyebrow {
  color:var(--accent);
  font-size:10px;
  letter-spacing:1.8px;
  font-weight:700;
}

.muted,.small { color:var(--muted);line-height:1.7; }
.small { font-size:12px; }

.layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:20px;
  align-items:start;
}

.primary { min-width:0; }

.card {
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  padding:20px;
  margin-bottom:18px;
  min-width:0;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.number { font-size:32px;font-weight:800;margin-top:12px; }

label {
  display:grid;
  gap:8px;
  margin:15px 0;
  color:var(--muted);
}

input,select,textarea {
  width:100%;
  min-width:0;
  padding:11px;
  border-radius:7px;
  border:1px solid #405167;
  background:#0f1721;
  color:var(--text);
}

textarea { min-height:85px;resize:vertical; }

.record {
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  padding:14px 0;
}

.record:last-child { border-bottom:0; }

.notice {
  border-left:3px solid var(--accent);
  background:#1b2a23;
  padding:13px;
  margin:15px 0;
  line-height:1.8;
}

.scroll { overflow:auto; }

.week,.calendar {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  min-width:630px;
}

.week span {
  padding:17px 8px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.calendar {
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.day {
  border-radius:0;
  background:var(--panel);
  color:var(--text);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  min-height:130px;
  padding:8px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:6px;
  text-align:left;
  overflow:hidden;
}

.day:hover { background:#1e2b39;filter:none; }
.day.blank { background:var(--bg); }
.day.selected { box-shadow:inset 0 0 0 2px var(--accent); }

.day-number {
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  align-self:flex-end;
}

.today {
  background:var(--accent);
  color:#17230c;
  border-radius:50%;
}

.event {
  padding:6px;
  border-radius:4px;
  background:#24364c;
  color:#e7effa;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event.done { background:#283b2a;color:var(--accent); }
.mark { font-size:10px;color:var(--accent); }

.goal-summary {
  list-style:none;
  cursor:pointer;
  display:grid;
  gap:10px;
}

.goal-summary::-webkit-details-marker { display:none; }
.goal-title { font-size:17px;font-weight:700; }
.goal-preview {
  padding-left:34px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--muted);
}

.review-section {
  border:1px solid var(--line);
  border-radius:8px;
  padding:15px;
  margin:12px 0;
}

.review-section summary { cursor:pointer;font-weight:700; }

.word-rail { position:sticky;top:20px; }
.word-rail h2 { font-size:16px; }
.word-rail blockquote {
  font-size:14px;
  line-height:1.9;
  margin:15px 0;
  overflow-wrap:anywhere;
}
.word-ref { color:var(--accent);font-size:12px; }
.word-rail .small { font-size:10px; }

video { width:100%;max-height:450px;background:#080c11;border-radius:8px; }

table { width:100%;border-collapse:collapse; }
th,td {
  text-align:left;
  padding:12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th { color:var(--muted); }

footer {
  border-top:1px solid var(--line);
  padding-top:18px;
  margin-top:25px;
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
}

#toast {
  position:fixed;
  bottom:20px;
  right:20px;
  padding:13px 20px;
  border-radius:8px;
  background:var(--accent);
  color:#17230c;
  z-index:50;
}
#toast:empty { display:none; }

@media(max-width:1250px) {
  .grid { grid-template-columns:1fr; }
}

@media(max-width:1000px) {
  .layout { grid-template-columns:1fr; }
  .word-rail { position:static; }
}

@media(max-width:750px) {
  aside { position:static;width:auto;padding:20px; }
  nav { display:flex;overflow:auto;margin-top:18px; }
  nav button { white-space:nowrap; }
  main { margin:0;padding:18px; }
}

@media(max-width:450px) {
  .stats { grid-template-columns:1fr;gap:0; }
  .card { padding:16px; }
}
</style>
</head>

<body>
<aside>
  <div class="brand">TOUCH<span>LINE</span></div>
  <div class="brand-sub">PLAYER PERFORMANCE WORKSPACE</div>
  <nav id="nav" aria-label="Main navigation"></nav>
</aside>

<main>
  <header>
    <div>
      <div class="eyebrow">TRAIN · REFLECT · GROW</div>
      <div class="small" id="todayLabel"></div>
    </div>

    <div class="actions">
      <button class="secondary" id="exportButton">백업</button>
      <button class="secondary" id="importButton">가져오기</button>
      <input type="file" id="backupFile" accept=".json,application/json" hidden>
      <button class="secondary" id="languageButton">EN</button>
    </div>
  </header>

  <h1 id="pageTitle">TOUCHLINE</h1>
  <p id="pageDescription" class="muted"></p>

  <div class="layout">
    <div id="content" class="primary"></div>

    <section class="card word-rail">
      <div class="eyebrow">DAILY WORD</div>
      <h2 id="wordTitle" style="margin-top:12px"></h2>
      <div id="wordContent" aria-live="polite"></div>
    </section>
  </div>

  <footer id="footer"></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================
   기본 설정
========================================= */

const $ = id => document.getElementById(id);
const KEY = "touchline-v1";

let lang = "ko";
let page = "overview";
let dirty = false;
let activeMatch = "";
let videoURL = null;
let selectedDay = dayKey(new Date());
let currentMonth = new Date();

currentMonth.setDate(1);

const emptyData = () => ({
  version:1,
  sessions:[],
  matches:[],
  recovery:[],
  journals:[],
  gratitude:[],
  tags:[],
  reactions:[],
  personalGoals:{
    short:"",
    long:"",
    ultimate:""
  }
});

let db = emptyData();

function tr(ko,en) {
  return lang === "ko" ? ko : en;
}

function dayKey(date) {
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function uid() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function notify(message) {
  $("toast").textContent = message;
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => {
    $("toast").textContent = "";
  },3500);
}

function normalize(source) {
  const result = emptyData();

  for(const key of [
    "sessions","matches","recovery",
    "journals","gratitude","tags","reactions"
  ]) {
    if(Array.isArray(source[key])) {
      result[key] = source[key].filter(
        item => item && typeof item === "object"
      );
    }
  }

  if(source.personalGoals &&
     typeof source.personalGoals === "object") {
    for(const key of ["short","long","ultimate"]) {
      result.personalGoals[key] =
        typeof source.personalGoals[key] === "string"
          ? source.personalGoals[key] : "";
    }
  }

  return result;
}

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if(saved && typeof saved === "object") {
    db = normalize(saved);
  }
} catch(error) {
  console.warn("Unable to load saved records.",error);
}

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(db));
    dirty = false;
    return true;
  } catch(error) {
    notify(tr(
      "저장 실패: 백업 버튼으로 기록을 보관하세요.",
      "Storage failed. Export a backup."
    ));
    return false;
  }
}

function canLeave() {
  return !dirty || confirm(tr(
    "저장하지 않은 내용을 버리고 이동할까요?",
    "Discard unsaved changes?"
  ));
}

function field(label,name,type="text",value="",extra="") {
  return `
    <label>
      ${label}
      <input
        type="${type}"
        name="${name}"
        value="${esc(value)}"
        ${extra}
      >
    </label>
  `;
}

function area(label,name,value="",extra="") {
  return `
    <label>
      ${label}
      <textarea
        name="${name}"
        maxlength="5000"
        ${extra}
      >${esc(value)}</textarea>
    </label>
  `;
}

function removeButton(collection,id) {
  return `
    <button
      class="danger"
      data-remove="${collection}"
      data-id="${esc(id)}"
      type="button"
    >${tr("삭제","Delete")}</button>
  `;
}

function emptyMessage() {
  return `<p class="muted">${tr(
    "아직 기록이 없습니다.",
    "No records yet."
  )}</p>`;
}

const names = {
  overview:["대시보드","Overview"],
  schedule:["훈련 일정 · 일지","Schedule & journal"],
  matches:["경기 기록 · 분석","Matches & analysis"],
  recovery:["회복 관리","Recovery"],
  programs:["훈련 프로그램","Programs"],
  growth:["성장 분석","Progress"],
  video:["영상 리뷰","Video review"]
};

/* =========================================
   화면
========================================= */

function render() {
  dirty = false;

  if(videoURL) {
    URL.revokeObjectURL(videoURL);
    videoURL = null;
  }

  document.documentElement.lang = lang;

  $("languageButton").textContent = lang === "ko" ? "EN" : "한국어";
  $("exportButton").textContent = tr("백업 내보내기","Export");
  $("importButton").textContent = tr("가져오기","Import");

  $("todayLabel").textContent = new Date().toLocaleDateString(
    lang === "ko" ? "ko-KR" : "en-GB"
  );

  $("pageTitle").textContent = names[page][lang === "ko" ? 0 : 1];

  $("pageDescription").textContent = tr(
    "오늘의 실천을 기록하고, 다음 경기에서 바꿀 한 가지를 찾아보세요.",
    "Record today's work and find one thing to improve next match."
  );

  $("nav").innerHTML = Object.entries(names).map(([key,label]) => `
    <button
      data-page="${key}"
      class="${key === page ? "active" : ""}"
      ${key === page ? 'aria-current="page"' : ""}
    >${label[lang === "ko" ? 0 : 1]}</button>
  `).join("");

  const screens = {
    overview:overviewView,
    schedule:scheduleView,
    matches:matchesView,
    recovery:recoveryView,
    programs:programsView,
    growth:growthView,
    video:videoView
  };

  $("content").innerHTML = screens[page]();

  $("footer").textContent = tr(
    "현재 브라우저에 저장되는 개인용 도구입니다. 정기적으로 백업하세요. 의료 진단·자동 AI 영상 분석·기기 간 동기화는 제공하지 않습니다.",
    "Personal browser-based workspace. Export backups regularly. No medical diagnosis, automated video analysis or cross-device sync."
  );

  bindCommon();
  renderWord();

  if(page === "overview") bindGoals();
  if(page === "schedule") bindSchedule();
  if(page === "matches") bindMatches();
  if(page === "recovery") bindRecovery();
  if(page === "programs") bindPrograms();
  if(page === "video") bindVideo();
}

function bindCommon() {
  document.querySelectorAll("[data-page]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;
      page = button.dataset.page;
      render();
    };
  });

  document.querySelectorAll("[data-remove]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;
      if(!confirm(tr("이 기록을 삭제할까요?","Delete this record?"))) return;

      const key = button.dataset.remove;
      db[key] = db[key].filter(
        item => String(item.id) !== button.dataset.id
      );

      save();
      render();
    };
  });

  document.querySelectorAll("form").forEach(form => {
    form.addEventListener("input",() => {
      dirty = true;
    });
  });
}

/* =========================================
   작은 목표 카드 + 대시보드
========================================= */

function overviewView() {
  const goals = db.personalGoals;
  const completed = db.sessions.filter(s => s.done);
  const minutes = completed.reduce(
    (total,s) => total + (Number(s.minutes) || 0),0
  );

  const upcoming = db.sessions
    .filter(s => !s.done && s.date >= dayKey(new Date()))
    .sort((a,b) => String(a.date).localeCompare(String(b.date)))
    .slice(0,3);

  return `
    <section class="card">
      <details id="goalsDetails">
        <summary class="goal-summary">
          <span class="goal-title">💡 🔑 MY GOALS</span>
          <span class="goal-preview">
            ${esc(goals.short || tr(
              "이번 달 목표를 적어보세요.",
              "Add your goal for this month."
            ))}
          </span>
        </summary>

        <form id="goalsForm" style="margin-top:20px">
          ${area(tr("단기적 목표","Short-term goal"),"short",goals.short)}
          ${area(tr("장기적 목표","Long-term goal"),"long",goals.long)}
          ${area(tr("궁극적 목표","Ultimate goal"),"ultimate",goals.ultimate)}
          <button>${tr("목표 저장","Save goals")}</button>
        </form>
      </details>
    </section>

    <div class="stats">
      <div class="card">
        <span class="small">${tr("완료 훈련","Completed sessions")}</span>
        <div class="number">${completed.length}</div>
      </div>
      <div class="card">
        <span class="small">${tr("훈련 시간 · 분","Training minutes")}</span>
        <div class="number">${minutes}</div>
      </div>
      <div class="card">
        <span class="small">${tr("경기 기록","Matches")}</span>
        <div class="number">${db.matches.length}</div>
      </div>
    </div>

    <section class="card">
      <h2>${tr("다가오는 훈련","Upcoming training")}</h2>

      ${upcoming.map(s => `
        <div class="record">
          <strong>${esc(s.name)}</strong>
          <span class="small">
            ${esc(s.date)} · ${Number(s.minutes) || 0} min
          </span>
        </div>
      `).join("") || emptyMessage()}

      <button data-page="schedule" style="margin-top:15px">
        ${tr("달력 · 오늘의 일지 열기","Open calendar & journal")}
      </button>
    </section>
  `;
}

function bindGoals() {
  $("goalsForm").onsubmit = event => {
    event.preventDefault();

    const values = new FormData(event.target);
    const goals = {};

    ["short","long","ultimate"].forEach(key => {
      goals[key] = String(values.get(key) || "").trim();
    });

    db.personalGoals = goals;

    if(save()) {
      render();
      notify(tr("목표를 저장했습니다.","Goals saved."));
    }
  };
}

/* =========================================
   월간 달력 · 일지 · 감사
========================================= */

function scheduleView() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const first = new Date(year,month,1).getDay();
  const days = new Date(year,month+1,0).getDate();

  let cells = "";

  for(let i=0;i<first;i++) {
    cells += '<div class="day blank" aria-hidden="true"></div>';
  }

  for(let n=1;n<=days;n++) {
    const key = dayKey(new Date(year,month,n));
    const sessions = db.sessions.filter(s => s.date === key);
    const hasJournal = db.journals.some(j => j.date === key);
    const hasThanks = db.gratitude.some(g => g.date === key);

    cells += `
      <button
        class="day ${key === selectedDay ? "selected" : ""}"
        data-day="${key}"
        aria-label="${key}"
        aria-pressed="${key === selectedDay}"
      >
        <span class="day-number ${
          key === dayKey(new Date()) ? "today" : ""
        }">${n}</span>

        ${sessions.slice(0,2).map(s => `
          <span class="event ${s.done ? "done" : ""}">
            ${s.done ? "✓ " : ""}${esc(s.name)}
          </span>
        `).join("")}

        ${sessions.length > 2
          ? `<span class="small">+${sessions.length-2}</span>` : ""}

        ${hasJournal
          ? `<span class="mark">✎ ${tr("일지","Journal")}</span>` : ""}

        ${hasThanks
          ? `<span class="mark">♡ ${tr("감사","Gratitude")}</span>` : ""}
      </button>
    `;
  }

  const tail = (7-(first+days)%7)%7;

  for(let i=0;i<tail;i++) {
    cells += '<div class="day blank" aria-hidden="true"></div>';
  }

  const journal = db.journals.find(j => j.date === selectedDay) || {};
  const thanks = db.gratitude.find(g => g.date === selectedDay) || {};
  const items = Array.isArray(thanks.items) ? thanks.items : [];
  const sessions = db.sessions.filter(s => s.date === selectedDay);

  return `
    <section class="card">
      <div class="toolbar">
        <div>
          <div class="eyebrow">MONTHLY SCHEDULE</div>
          <h2 style="margin:10px 0">
            ${currentMonth.toLocaleDateString(
              lang === "ko" ? "ko-KR" : "en-GB",
              {year:"numeric",month:"long"}
            )}
          </h2>
        </div>

        <div class="actions">
          <button class="secondary" id="previousMonth"
            aria-label="${tr("이전 달","Previous month")}">‹</button>
          <button class="secondary" id="todayButton">
            ${tr("오늘","Today")}
          </button>
          <button class="secondary" id="nextMonth"
            aria-label="${tr("다음 달","Next month")}">›</button>
        </div>
      </div>

      <p class="small">
        ${tr(
          "날짜를 누르면 아래에서 훈련·일지·감사를 작성할 수 있습니다.",
          "Select a date to manage training, journal and gratitude."
        )}
      </p>

      <div class="scroll">
        <div class="week">
          ${tr(
            "일,월,화,수,목,금,토",
            "Sun,Mon,Tue,Wed,Thu,Fri,Sat"
          ).split(",").map(d => `<span>${d}</span>`).join("")}
        </div>
        <div class="calendar">${cells}</div>
      </div>
    </section>

    <h2>${selectedDay}</h2>

    <div class="grid">
      <section class="card">
        <h2>${tr("선택한 날의 훈련","Selected day's training")}</h2>

        ${sessions.map(s => `
          <div class="record">
            <div>
              <strong>${esc(s.name)}</strong>
              <div class="small">
                ${Number(s.minutes) || 0} min · RPE ${Number(s.rpe) || 0}
              </div>
            </div>
            <div class="actions">
              <button class="secondary" data-complete="${esc(s.id)}">
                ${s.done ? tr("완료 ✓","Done ✓") : tr("완료 처리","Mark done")}
              </button>
              ${removeButton("sessions",s.id)}
            </div>
          </div>

function bindSchedule() {
  function move(offset) {
    if(!canLeave()) return;

    currentMonth = new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth()+offset,
      1
    );

    render();
  }

  $("previousMonth").onclick = () => move(-1);
  $("nextMonth").onclick = () => move(1);

  $("todayButton").onclick = () => {
    if(!canLeave()) return;
    selectedDay = dayKey(new Date());
    currentMonth = new Date();
    currentMonth.setDate(1);
    render();
  };

  document.querySelectorAll("[data-day]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;
      selectedDay = button.dataset.day;
      render();
    };
  });

  document.querySelectorAll("[data-complete]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;

      const session = db.sessions.find(
        s => String(s.id) === button.dataset.complete
      );

      if(!session) return;
      session.done = !session.done;
      save();
      render();
    };
  });

  $("sessionForm").onsubmit = event => {
    event.preventDefault();

    const values = new FormData(event.target);
    const name = String(values.get("name") || "").trim();
    if(!name) return;

    db.sessions.push({
      id:uid(),
      date:selectedDay,
      name,
      minutes:Number(values.get("minutes")),
      rpe:Number(values.get("rpe")),
      done:false
    });

    if(save()) {
      render();
      notify(tr("훈련을 추가했습니다.","Training added."));
    }
  };

  $("journalForm").onsubmit = event => {
    event.preventDefault();

    const record = Object.fromEntries(new FormData(event.target));
    if(!record.body.trim()) return;

    record.date = selectedDay;
    record.updatedAt = new Date().toISOString();

    db.journals = db.journals.filter(j => j.date !== selectedDay);
    db.journals.push(record);

    if(save()) {
      render();
      notify(tr("일지를 저장했습니다.","Journal saved."));
    }
  };

  $("gratitudeForm").onsubmit = event => {
    event.preventDefault();

    const values = new FormData(event.target);
    const items = [0,1,2].map(
      i => String(values.get("thanks"+i) || "").trim()
    );

    const reflection = String(values.get("reflection") || "").trim();

    if(!items.some(Boolean) && !reflection) {
      notify(tr("한 항목 이상 작성하세요.","Write at least one entry."));
      return;
    }

    db.gratitude = db.gratitude.filter(g => g.date !== selectedDay);
    db.gratitude.push({
      date:selectedDay,
      items,
      reflection,
      updatedAt:new Date().toISOString()
    });

    if(save()) {
      render();
      notify(tr("감사 기록을 저장했습니다.","Gratitude saved."));
    }
  };
}

function bindMatches() {
  $("matchForm").onsubmit = event => {
    event.preventDefault();

    const values = Object.fromEntries(new FormData(event.target));
    values.opponent = values.opponent.trim();
    if(!values.opponent) return;

    ["minutes","goals","assists"].forEach(key => {
      values[key] = Number(values[key]);
    });

    values.id = uid();
    db.matches.push(values);
    activeMatch = values.id;

    if(save()) render();
  };

  if(!$("reviewForm")) return;

  const form = $("reviewForm");

  function ratios() {
    function rate(success,attempts) {
      const a = form.elements.namedItem(success).value;
      const b = form.elements.namedItem(attempts).value;

      return a !== "" && b !== "" &&
        Number(b) > 0 && Number(a) <= Number(b)
          ? (Number(a)/Number(b)*100).toFixed(1)+"%"
          : "—";
    }

    $("ratios").textContent =
      tr("패스 성공률","Pass completion")+": "+
      rate("passesCompleted","passesAttempted")+" · "+
      tr("유효 슈팅 비율","Shots on target")+": "+
      rate("shotsOnTarget","shots")+" · "+
      tr("경합 성공률","Duels won")+": "+
      rate("duelsWon","duelsAttempted");
  }

  ratios();
  form.addEventListener("input",ratios);

  $("matchSelect").onchange = event => {
    if(!canLeave()) {
      event.target.value = activeMatch;
      return;
    }
    activeMatch = event.target.value;
    render();
  };

  form.onsubmit = event => {
    event.preventDefault();

    const values = new FormData(form);
    const review = {};

    reviewGroups.forEach(group => {
      group[2].forEach(([key]) => {
        review[key] = String(values.get(key) || "").trim();
      });
    });

    countFields.forEach(([key]) => {
      const value = values.get(key);
      if(value !== "") review[key] = Number(value);
    });

    for(const [success,attempts] of [
      ["passesCompleted","passesAttempted"],
      ["shotsOnTarget","shots"],
      ["duelsWon","duelsAttempted"]
    ]) {
      if(review[success] !== undefined &&
         review[attempts] !== undefined &&
         review[success] > review[attempts]) {
        notify(tr(
          "성공 수는 시도 수보다 클 수 없습니다.",
          "Successful counts cannot exceed attempts."
        ));
        return;
      }
    }

    review.updatedAt = new Date().toISOString();

    const match = db.matches.find(m => m.id === activeMatch);
    if(!match) return;
    match.review = review;

    if(save()) notify(tr("분석을 저장했습니다.","Analysis saved."));
  };

  $("deleteReview").onclick = () => {
    if(!confirm(tr("분석만 삭제할까요?","Delete analysis only?"))) return;

    const match = db.matches.find(m => m.id === activeMatch);
    if(!match) return;

    delete match.review;
    save();
    render();
  };
}

function growthView() {
  const rows = [];

  for(let i=3;i>=0;i--) {
    const end = new Date();
    end.setDate(end.getDate()-i*7);

    const start = new Date(end);
    start.setDate(start.getDate()-6);

    const from = dayKey(start);
    const to = dayKey(end);

    const sessions = db.sessions.filter(
      s => s.done && s.date >= from && s.date <= to
    );

    rows.push({
      from,to,
      count:sessions.length,
      minutes:sessions.reduce(
        (sum,s) => sum+(Number(s.minutes) || 0),0
      ),
      load:sessions.reduce(
        (sum,s) => sum+
          (Number(s.minutes) || 0)*(Number(s.rpe) || 0),0
      )
    });
  }

  return `
    <section class="card">
      <h2>${tr("최근 4주 훈련 요약","Last four weeks")}</h2>

      <div class="scroll">
        <table>
          <thead><tr>
            <th>${tr("기간","Period")}</th>
            <th>${tr("완료 수","Sessions")}</th>
            <th>${tr("시간 · 분","Minutes")}</th>
            <th>${tr("주관적 부하 · AU","Subjective load · AU")}</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.from} — ${r.to}</td>
                <td>${r.count}</td>
                <td>${r.minutes}</td>
                <td>${r.load}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <p class="small">
        ${tr(
          "부하 = 완료한 훈련의 시간 × 입력 RPE의 합입니다. 실력 향상이나 부상 위험을 판정하는 수치가 아닙니다.",
          "Load = sum of completed session minutes × entered RPE. Not a measure of skill improvement or injury risk."
        )}
      </p>
    </section>
  `;
}

/* =========================================
   내 영상 리뷰
========================================= */

function videoView() {
  return `
    <section class="card">
      <h2>${tr("내 영상 리뷰","Review your video")}</h2>

      <label>
        ${tr("영상 파일 선택","Choose a video")}
        <input id="videoFile" type="file" accept="video/*">
      </label>

      <video id="player" controls playsinline></video>
      <p id="videoStatus" class="small"></p>

      <label>
        ${tr("현재 장면 메모","Current scene note")}
        <textarea id="videoNote" maxlength="2000"></textarea>
      </label>

      <button id="addTag">
        ${tr("현재 시점 태그 저장","Save timestamp note")}
      </button>

      <div class="notice">
        ${tr(
          "영상은 서버로 전송되지 않습니다. 재접속 시 다시 선택하세요. 수동 리뷰 도구이며 자동 선수 추적·AI 분석은 제공하지 않습니다.",
          "Video stays on your device. Select it again after returning. Manual review only; no automatic tracking or AI analysis."
        )}
      </div>

      <div id="tagList"></div>
    </section>
  `;
}

function bindVideo() {
  function renderTags() {
    $("tagList").innerHTML = db.tags.map(tag => `
      <div class="record">
        <div>
          <strong>${esc(tag.note)}</strong>
          <div class="small">
            ${esc(tag.file)} · ${Math.floor(Number(tag.time) || 0)}s
          </div>
        </div>
        <div class="actions">
          <button class="secondary" data-seek="${esc(tag.id)}">
            ${tr("이동","Seek")}
          </button>
          <button class="danger" data-delete-tag="${esc(tag.id)}">
            ${tr("삭제","Delete")}
          </button>
        </div>
      </div>
    `).join("") || emptyMessage();

    document.querySelectorAll("[data-seek]").forEach(button => {
      button.onclick = () => {
        const tag = db.tags.find(
          t => String(t.id) === button.dataset.seek
        );

        const player = $("player");

        if(!tag ||
           player.dataset.file !== tag.file ||
           player.readyState < 1) {
          notify(tr(
            "같은 영상 파일을 먼저 선택하세요. 파일명으로 비교합니다.",
            "Select the matching video first. Matching uses filename."
          ));
          return;
        }

        player.currentTime = Number(tag.time) || 0;
      };
    });

    document.querySelectorAll("[data-delete-tag]").forEach(button => {
      button.onclick = () => {
        if(!confirm(tr("태그를 삭제할까요?","Delete this tag?"))) return;

        db.tags = db.tags.filter(
          tag => String(tag.id) !== button.dataset.deleteTag
        );

        save();
        renderTags();
      };
    });
  }

  renderTags();

  $("videoFile").onchange = event => {
    const file = event.target.files[0];
    if(!file) return;

    if(videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(file);

    $("player").src = videoURL;
    $("player").dataset.file = file.name;
    $("videoStatus").textContent = file.name;
  };

  $("player").onerror = () => {
    $("videoStatus").textContent = tr(
      "재생할 수 없는 영상 형식입니다. MP4(H.264/AAC)를 권장합니다.",
      "Unsupported video. MP4 with H.264/AAC is recommended."
    );
  };

  $("addTag").onclick = () => {
    const player = $("player");
    const note = $("videoNote").value.trim();

    if(!player.dataset.file || player.readyState < 1 || !note) {
      notify(tr(
        "영상을 불러오고 메모를 입력하세요.",
        "Load a video and enter a note."
      ));
      return;
    }

    db.tags.push({
      id:uid(),
      file:player.dataset.file,
      time:player.currentTime,
      note
    });

    if(save()) {
      $("videoNote").value = "";
      renderTags();
      notify(tr("태그를 저장했습니다.","Tag saved."));
    }
  };
}

/* =========================================
   매일 다른 성경 말씀 · 한국어/영어
   온라인 공개 성경 데이터 사용
========================================= */

const BIBLE_BASE =
  "https://raw.githubusercontent.com/thiagobodruk/bible/master/json/";

let bibleData = null;
let bibleLoading = false;

/*
  날짜별 목록의 시작일.
  목록 끝에서는 처음으로 돌아가지 않습니다.
*/
const VERSE_START = "2026-11-03";

/*
  성실·용기·감사·사랑·협력 등을 돌아볼 수 있는
  장들을 포함합니다. 각 구절은 앞뒤 문맥과 함께 읽으세요.
*/
const readingChapters = {
  18:[1,19,23,27,34,46,62,91,100,103,121,139,145],
  19:[3,4,16,24,27],
  39:[5,6,7],
  42:[15],
  44:[12],
  45:[12,13],
  47:[5,6],
  48:[4,6],
  49:[2,3,4],
  50:[3],
  51:[5],
  57:[12,13],
  58:[1,3,4,5],
  59:[4,5]
};

/* 처음에 배치할 본문: 책 번호는 0부터 시작 */
const priorityVerses = [
  [49,4,13],
  [47,6,9],
  [19,16,3],
  [18,56,3],
  [51,5,18],
  [45,16,14],
  [18,23,1],
  [19,24,16],
  [18,119,105],
  [51,5,11],
  [19,27,17],
  [18,46,1],
  [50,3,23]
];

function serialDay(value) {
  const [year,month,day] = value.split("-").map(Number);
  return Date.UTC(year,month-1,day)/86400000;
}

function buildVerseList(ko,en) {
  const references = [...priorityVerses];

  for(const [book,chapters] of Object.entries(readingChapters)) {
    for(const chapter of chapters) {
      const korean = ko[Number(book)]?.chapters?.[chapter-1];
      const english = en[Number(book)]?.chapters?.[chapter-1];

      if(!Array.isArray(korean) ||
         !Array.isArray(english) ||
         korean.length !== english.length) continue;

      for(let verse=1;verse<=korean.length;verse++) {
        references.push([Number(book),chapter,verse]);
      }
    }
  }

  const seen = new Set();
  const result = [];

  for(const [book,chapter,verse] of references) {
    const key = [book,chapter,verse].join(":");
    if(seen.has(key)) continue;

    const korean = ko[book]?.chapters?.[chapter-1]?.[verse-1];
    const english = en[book]?.chapters?.[chapter-1]?.[verse-1];

    if(typeof korean !== "string" ||
       typeof english !== "string" ||
       !korean.trim() || !english.trim()) continue;

    seen.add(key);

    result.push({
      koRef:ko[book].name+" "+chapter+":"+verse,
      enRef:en[book].name+" "+chapter+":"+verse,
      ko:korean,
      en:english
    });
  }

  return result;
}

async function loadBible() {
  if(bibleData || bibleLoading) return;

  bibleLoading = true;

  try {
    const files = ["ko_krv","en_kjv"];

    const books = await Promise.all(files.map(async code => {
      const response = await fetch(BIBLE_BASE+code+".json");
      if(!response.ok) throw new Error("Bible download failed");

      const json = await response.json();
      if(!Array.isArray(json) || json.length !== 66) {
        throw new Error("Invalid Bible data");
      }

      return json;
    }));

    bibleData = buildVerseList(books[0],books[1]);

    if(!bibleData.length) throw new Error("No readings");

  } catch(error) {
    console.warn("Unable to load scripture.",error);

  } finally {
    bibleLoading = false;
    renderWord();
  }
}

function renderWord() {
  $("wordTitle").textContent = tr("오늘의 말씀","Today's scripture");

  if(!bibleData) {
    $("wordContent").innerHTML = `
      <p class="small">
        ${bibleLoading
          ? tr("말씀을 불러오는 중입니다…","Loading scripture…")
          : tr(
              "말씀을 불러오지 못했습니다. 인터넷 연결을 확인하세요.",
              "Unable to load scripture. Check your connection."
            )}
      </p>
      ${!bibleLoading ? `
        <button class="secondary" id="retryBible">
          ${tr("다시 불러오기","Retry")}
        </button>
      ` : ""}
    `;

    if($("retryBible")) $("retryBible").onclick = loadBible;
    return;
  }

  const today = dayKey(new Date());
  const index = serialDay(today)-serialDay(VERSE_START);
  const verse = bibleData[index];

  if(!verse) {
    $("wordContent").innerHTML = `
      <p class="small">${today}</p>
      <p class="small">
        ${tr(
          "이 날짜의 말씀 목록을 추가해야 합니다. 이전 말씀을 반복하지 않습니다.",
          "The reading list needs extending for this date. Earlier readings are not repeated."
        )}
      </p>
    `;
    return;
  }

  $("wordContent").innerHTML = `
    <p class="small">${today}</p>
    <strong class="word-ref">
      ${esc(tr(verse.koRef,verse.enRef))}
    </strong>
    <blockquote>${esc(tr(verse.ko,verse.en))}</blockquote>
    <p class="small">${tr("개역한글","King James Version")}</p>
    <p class="small">
      ${tr(
        "성실·용기·사랑·감사를 돌아보는 말씀입니다. 경기 승리나 성적을 보장하는 의미는 아닙니다. 앞뒤 문맥과 함께 읽어보세요.",
        "Reflect on diligence, courage, love and gratitude. Read in context, not as a promise of sporting success."
      )}
    </p>
    <a
      class="small"
      style="color:var(--muted)"
      href="https://github.com/thiagobodruk/bible"
      target="_blank"
      rel="noopener noreferrer"
    >${tr("본문 데이터 출처","Scripture data source")}</a>
  `;
}

/* 날짜가 바뀌면 작성 중인 일지를 건드리지 않고 말씀만 갱신 */
let lastWordDay = dayKey(new Date());

function checkNewDay() {
  const today = dayKey(new Date());
  if(today === lastWordDay) return;

  lastWordDay = today;
  $("todayLabel").textContent = new Date().toLocaleDateString(
    lang === "ko" ? "ko-KR" : "en-GB"
  );

  renderWord();
}

setInterval(checkNewDay,30000);

document.addEventListener("visibilitychange",() => {
  if(!document.hidden) checkNewDay();
});

/* =========================================
   백업 · 언어 전환
========================================= */

$("languageButton").onclick = () => {
  if(!canLeave()) return;
  lang = lang === "ko" ? "en" : "ko";
  render();
};

$("exportButton").onclick = () => {
  const blob = new Blob(
    [JSON.stringify(db,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "touchline-backup-"+dayKey(new Date())+".json";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url),1000);
};

$("importButton").onclick = () => {
  $("backupFile").click();
};

$("backupFile").onchange = async event => {
  const file = event.target.files[0];
  if(!file) return;

  try {
    if(file.size > 10000000) throw new Error("Too large");

    const incoming = JSON.parse(await file.text());

    if(!incoming ||
       incoming.version !== 1 ||
       !Array.isArray(incoming.sessions) ||
       !Array.isArray(incoming.matches)) {
      throw new Error("Invalid backup");
    }

    if(!canLeave()) return;

    if(!confirm(tr(
      "현재 기록 전체를 백업 파일의 내용으로 교체할까요?",
      "Replace all current records with this backup?"
    ))) return;

    db = normalize(incoming);

    if(save()) {
      render();
      notify(tr("백업을 가져왔습니다.","Backup imported."));
    }

  } catch(error) {
    notify(tr(
      "올바른 TOUCHLINE 백업 파일이 아닙니다.",
      "Invalid TOUCHLINE backup file."
    ));

  } finally {
    event.target.value = "";
  }
};

window.addEventListener("beforeunload",event => {
  if(dirty) {
    event.preventDefault();
    event.returnValue = "";
  }

  if(videoURL) URL.revokeObjectURL(videoURL);
});

/* 시작 */
render();
loadBible();
</script>
