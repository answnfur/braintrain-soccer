<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOUCHLINE · Player Workspace</title>

<style>
:root {
  --bg:#0c1118;
  --panel:#151e29;
  --line:#2b3848;
  --text:#eef3f8;
  --muted:#aebdcc;
  --accent:#c9f36b;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px system-ui,"Apple SD Gothic Neo",sans-serif;
}

button,input,select,textarea { font:inherit; }

button {
  border:0;
  border-radius:7px;
  padding:10px 14px;
  background:var(--accent);
  color:#17230c;
  cursor:pointer;
  font-weight:700;
}

button:hover { filter:brightness(1.08); }

button:focus-visible,
summary:focus-visible {
  outline:2px solid white;
  outline-offset:3px;
}

.secondary { background:#263445;color:var(--text); }
.danger { background:#452b35;color:#ffd5df; }

aside {
  position:fixed;
  inset:0 auto 0 0;
  width:210px;
  padding:28px 16px;
  background:#101721;
  border-right:1px solid var(--line);
}

.brand { font-size:23px;font-weight:900;letter-spacing:-1px; }
.brand span { color:var(--accent); }
.brand-sub { margin-top:6px;font-size:10px;color:var(--muted); }

nav { display:grid;gap:7px;margin-top:32px; }
nav button { text-align:left;background:transparent;color:var(--muted); }
nav .active { background:#253329;color:var(--accent); }

main { margin-left:210px;padding:26px 30px; }

header,.toolbar,.actions,.record {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

header,.toolbar { justify-content:space-between; }

header {
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}

h1 { margin:28px 0 8px;font-size:32px; }
h2 { margin:0 0 16px;font-size:19px; }
h3 { font-size:16px; }

.eyebrow {
  color:var(--accent);
  font-size:10px;
  letter-spacing:1.8px;
  font-weight:700;
}

.muted,.small { color:var(--muted);line-height:1.7; }
.small { font-size:12px; }

.layout {
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:20px;
  align-items:start;
}

.primary { min-width:0; }

.card {
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  padding:20px;
  margin-bottom:18px;
  min-width:0;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.number { font-size:32px;font-weight:800;margin-top:12px; }

label {
  display:grid;
  gap:8px;
  margin:15px 0;
  color:var(--muted);
}

input,select,textarea {
  width:100%;
  min-width:0;
  padding:11px;
  border-radius:7px;
  border:1px solid #405167;
  background:#0f1721;
  color:var(--text);
}

textarea { min-height:85px;resize:vertical; }

.record {
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  padding:14px 0;
}

.record:last-child { border-bottom:0; }

.notice {
  border-left:3px solid var(--accent);
  background:#1b2a23;
  padding:13px;
  margin:15px 0;
  line-height:1.8;
}

.scroll { overflow:auto; }

.week,.calendar {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  min-width:630px;
}

.week span {
  padding:17px 8px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.calendar {
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.day {
  border-radius:0;
  background:var(--panel);
  color:var(--text);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  min-height:130px;
  padding:8px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:6px;
  text-align:left;
  overflow:hidden;
}

.day:hover { background:#1e2b39;filter:none; }
.day.blank { background:var(--bg); }
.day.selected { box-shadow:inset 0 0 0 2px var(--accent); }

.day-number {
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  align-self:flex-end;
}

.today {
  background:var(--accent);
  color:#17230c;
  border-radius:50%;
}

.event {
  padding:6px;
  border-radius:4px;
  background:#24364c;
  color:#e7effa;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event.done { background:#283b2a;color:var(--accent); }
.mark { font-size:10px;color:var(--accent); }

.goal-summary {
  list-style:none;
  cursor:pointer;
  display:grid;
  gap:10px;
}

.goal-summary::-webkit-details-marker { display:none; }
.goal-title { font-size:17px;font-weight:700; }
.goal-preview {
  padding-left:34px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--muted);
}

.review-section {
  border:1px solid var(--line);
  border-radius:8px;
  padding:15px;
  margin:12px 0;
}

.review-section summary { cursor:pointer;font-weight:700; }

.word-rail { position:sticky;top:20px; }
.word-rail h2 { font-size:16px; }
.word-rail blockquote {
  font-size:14px;
  line-height:1.9;
  margin:15px 0;
  overflow-wrap:anywhere;
}
.word-ref { color:var(--accent);font-size:12px; }
.word-rail .small { font-size:10px; }

video { width:100%;max-height:450px;background:#080c11;border-radius:8px; }

table { width:100%;border-collapse:collapse; }
th,td {
  text-align:left;
  padding:12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th { color:var(--muted); }

footer {
  border-top:1px solid var(--line);
  padding-top:18px;
  margin-top:25px;
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
}

#toast {
  position:fixed;
  bottom:20px;
  right:20px;
  padding:13px 20px;
  border-radius:8px;
  background:var(--accent);
  color:#17230c;
  z-index:50;
}
#toast:empty { display:none; }

@media(max-width:1250px) {
  .grid { grid-template-columns:1fr; }
}

@media(max-width:1000px) {
  .layout { grid-template-columns:1fr; }
  .word-rail { position:static; }
}

@media(max-width:750px) {
  aside { position:static;width:auto;padding:20px; }
  nav { display:flex;overflow:auto;margin-top:18px; }
  nav button { white-space:nowrap; }
  main { margin:0;padding:18px; }
}

@media(max-width:450px) {
  .stats { grid-template-columns:1fr;gap:0; }
  .card { padding:16px; }
}

/* Compact training video cards */
.training-video-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  align-items:start;
  margin-bottom:18px;
}
.training-video-grid > .card {min-width:0;padding:12px;margin:0;}
.training-video-grid h2 {font-size:17px;margin:8px 0 10px;}
.training-video-grid .eyebrow {font-size:9px;letter-spacing:1px;}
.training-video-grid video {display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px;}
.training-video-grid .small {font-size:11px;overflow-wrap:anywhere;}
@media(max-width:650px) {
  .training-video-grid {grid-template-columns:repeat(3,minmax(170px,1fr));overflow-x:auto;padding-bottom:10px;}
}


/* Two-column training cards: four plans occupy a 2 x 2 grid. */
.training-plan-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0;align-items:stretch;}
.training-plan-grid > .card {min-width:0;margin:0;}
.training-plan-grid > article {min-width:0;padding:16px !important;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere;}
.training-plan-grid h2,.training-plan-grid h3,.training-plan-grid p {overflow-wrap:anywhere;}
@media(max-width:480px) {.training-plan-grid {gap:8px;} .training-plan-grid > .card,.training-plan-grid > article {padding:10px !important;} .training-plan-grid button {max-width:100%;white-space:normal;}}


.training-plus {display:inline-flex;align-items:center;justify-content:center;flex:0 0 38px;width:38px;height:38px;padding:0;font-size:27px;line-height:1;border-radius:50%;}
#customPlanPanel[hidden] {display:none !important;}

.writing-toggle > summary {cursor:pointer;font-size:18px;font-weight:700;padding:10px 0;color:var(--text);}
.writing-toggle > summary::marker {color:var(--accent);}
.writing-toggle[open] > summary {margin-bottom:12px;}
.writing-toggle > summary:focus-visible {outline:2px solid var(--accent);outline-offset:4px;}

/* Clean, readable training descriptions */
.training-video-grid {align-items:start;}
.training-video-grid > .card {padding:16px;border-radius:16px;}
.training-video-grid h2 {margin:0 0 12px !important;font-size:18px;}
.training-video-grid .writing-toggle {margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.training-video-grid .writing-toggle > summary {cursor:pointer;font-weight:600;padding:4px 0;}
.training-description-content {padding-top:14px;overflow-wrap:anywhere;}
.training-description-content h3 {margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--accent);}
.training-description-content p,.training-description-empty {font-size:13px;line-height:1.85;margin:0 0 12px;word-break:keep-all;overflow-wrap:anywhere;}
.training-description-content p:last-child {margin-bottom:0;}
.video-file-status:empty {display:none;}


/* TOUCHLINE visual refinement */
:root {--bg:#0a1116;--panel:#111d24;--line:#2a3b43;--text:#f2f7f6;--muted:#b2c2c8;--accent:#cbf577;}
body {background:radial-gradient(ellipse at 80% 0%,#18352e 0,transparent 38rem),var(--bg);font-size:15px;}
aside {background:#0e181e;}
.brand {display:flex;align-items:center;gap:0;}
.brand::before {content:"";width:22px;height:15px;flex:none;margin-right:9px;border:1px solid var(--accent);border-radius:3px;background:linear-gradient(90deg,transparent 47%,var(--accent) 47% 53%,transparent 53%);}
.brand-sub {letter-spacing:.08em;line-height:1.5;}
nav button {border-radius:9px;border:1px solid transparent;line-height:1.35;}
nav .active {border-color:#45604a;background:#20392c;}
main {max-width:1660px;}
header {padding-bottom:16px;}
#languageButton {width:auto;min-width:110px;max-width:100%;}
.page-intro {position:relative;overflow:hidden;margin:24px 0;padding:clamp(18px,3vw,36px);border:1px solid #3b574c;border-radius:20px;background:linear-gradient(105deg,#14251f 35%,#203a31);isolation:isolate;}
.page-intro::after {content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:repeating-linear-gradient(120deg,transparent 0 31px,#c9f36b14 31px 32px);mask-image:linear-gradient(90deg,transparent 35%,#000);}
.page-intro h1 {margin:0;font-size:clamp(26px,4vw,42px);letter-spacing:-.04em;line-height:1.15;overflow-wrap:anywhere;}
.page-intro p {margin:9px 0 0;max-width:62ch;}
.card {border-radius:16px;box-shadow:0 7px 22px #0002;}
.word-rail {border-top:3px solid var(--accent);}
.word-rail blockquote {margin:14px 0;padding-left:12px;border-left:2px solid #66874c;line-height:1.6;}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible {outline:2px solid var(--accent);outline-offset:3px;}
.training-video-grid {scroll-snap-type:x proximity;scrollbar-color:#52745a #14221f;}
.training-video-grid > .card {scroll-snap-align:start;}
.training-video-grid video {border:1px solid var(--line);}
@media(max-width:750px){.page-intro {margin:16px 0;border-radius:15px;} nav {padding-bottom:6px;} header .actions {gap:6px;}}


.page-intro {background:repeating-linear-gradient(90deg,#ffffff04 0 48px,transparent 48px 96px),linear-gradient(105deg,#10241a 20%,#236341);border-color:#518463;min-height:150px;display:flex;flex-direction:column;justify-content:center;}
.page-intro::after {display:none;}
.pitch-markings {position:absolute;z-index:-1;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg);width:min(43%,360px);color:#d6ffdc;opacity:.33;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 28%);}
.training-video-grid {counter-reset:drill;}
.training-video-grid > .card {counter-increment:drill;border-top:2px solid #91bc62;}
.training-video-grid h2::before {content:counter(drill,decimal-leading-zero);display:inline-block;margin-right:.5em;padding:.18em .4em;border-radius:4px;background:#254332;color:var(--accent);font-size:.65em;vertical-align:middle;font-variant-numeric:tabular-nums;}
@media(max-width:550px){.pitch-markings {right:-16px;width:62%;opacity:.18;} .page-intro {min-height:116px;}}

/* Restrained performance dashboard */
:root {--bg:#101618;--panel:#182022;--line:#334043;--text:#edf0ee;--muted:#b4c0bd;--accent:#abc8ae;}
body {background:var(--bg);}
aside {background:#131b1d;}
.brand {font-size:21px;letter-spacing:.045em;font-weight:750;}
.brand::before {display:none;}
.brand span {color:inherit;}
.brand-sub {font-size:9px;letter-spacing:.1em;}
nav .active {background:#253330;border-color:#3e5149;color:#d1e5d2;}
button {border-radius:6px;background:var(--accent);color:#15251e;}
.secondary {background:#273234;color:var(--text);}
.danger {background:#452b35;color:#ffd5df;}
.page-intro {background:linear-gradient(110deg,#1a2727,#21352f);border-color:#394b43;border-radius:10px;min-height:132px;}
.page-intro h1 {font-size:clamp(25px,3.2vw,36px);font-weight:730;letter-spacing:-.025em;}
.pitch-markings {opacity:.15;transform:translateY(-50%);color:#bed4c2;}
.card,.training-video-grid > .card {border-radius:9px;box-shadow:none;}
.training-video-grid > .card,.word-rail {border-top:1px solid var(--line);}
.training-video-grid h2::before {background:none;color:var(--muted);padding:0 .25em 0 0;font-size:.63em;letter-spacing:.06em;}
.training-video-grid video {border-radius:5px;}
@media(max-width:550px){.pitch-markings {opacity:.1;}.page-intro {min-height:112px;}}

/* Matchday editorial */
:root {--bg:#101417;--panel:#191f22;--line:#30393b;--text:#f5f5f0;--muted:#b6c1bd;--accent:#dfefaa;}
aside {background:#111719;}
.brand span {color:var(--accent);}
nav .active {border-color:#364943;border-left:3px solid var(--accent);background:#1d3028;color:var(--accent);}
.page-intro {background:linear-gradient(102deg,#10251e 12%,#173c2d 64%,#22523e);border-color:#3d6250;border-left:4px solid var(--accent);min-height:190px;padding:clamp(19px,4vw,42px);}
.pitch-kicker {display:flex;align-items:center;gap:8px;font-size:10px;font-weight:750;letter-spacing:.15em;color:var(--accent);margin-bottom:14px;}
.pitch-kicker span {width:18px;height:1px;background:currentColor;flex:none;}
.page-intro h1 {font-size:clamp(28px,4.3vw,54px);font-weight:850;letter-spacing:-.055em;max-width:90%;}
.page-intro p {color:#d5e2dc;}
.pitch-markings {width:min(53%,420px);opacity:.26;right:-20px;transform:translate(0,-50%) rotate(-12deg);}
.training-video-grid > .card {border-top:2px solid #708873;background:linear-gradient(180deg,#222c2b,var(--panel) 40%);}
.training-video-grid h2::before {color:var(--accent);font-variant-numeric:tabular-nums;}
.word-rail {border-top:2px solid #708873;}
@media(max-width:550px){.page-intro {min-height:148px;}.pitch-markings {width:70%;opacity:.14;}.pitch-kicker {font-size:9px;letter-spacing:.09em;}}

.match-summary h2 {margin-top:8px;}
.match-kpis {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0;}
.match-kpis > div {background:#111b19;border:1px solid var(--line);padding:12px;border-radius:7px;}
.match-kpis dt {color:var(--muted);font-size:12px;}
.match-kpis dd {margin:6px 0 0;font-size:clamp(20px,3vw,32px);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
#matchReviewPanel {scroll-margin-top:16px;}
@media(max-width:550px){.match-kpis {grid-template-columns:repeat(2,minmax(0,1fr));}}
.match-table-scroll {overflow-x:auto;}
.match-trends table {width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums;}
.match-trends th,.match-trends td {padding:10px;border-bottom:1px solid var(--line);}
.match-check {display:flex;align-items:center;gap:8px;}
.match-check input {width:auto;}
.calendar-day-cell {position:relative;min-width:0;}
.calendar-day-cell > .day {width:100%;height:100%;}
.day-journal-add {position:absolute;top:6px;left:6px;width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1;}
@media (hover:hover) and (pointer:fine) {
  .day-journal-add {opacity:0;pointer-events:none;}
  .calendar-day-cell:hover .day-journal-add,
  .calendar-day-cell:focus-within .day-journal-add {opacity:1;pointer-events:auto;}
}
.sleep-stat {text-align:center;min-width:0;}
.sleep-ring {width:124px;aspect-ratio:1;border-radius:50%;margin:12px auto;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--sleep-angle),var(--line) 0);}
.sleep-ring strong {width:96px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-size:22px;}
.sleep-stat-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.sleep-ring {width:min(124px,100%);}
.sleep-ring strong {width:77%;font-size:clamp(14px,4vw,22px);}
#sleepAlarmForm fieldset {min-width:0;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;}
.alarm-time-selects {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}

.alarm-clock-display {display:flex;align-items:center;justify-content:center;gap:clamp(18px,6vw,48px);flex-wrap:wrap;padding:24px 12px;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(ellipse at 30% 50%,#263232,var(--bg) 75%);}
.alarm-dial {position:relative;width:152px;aspect-ratio:1;border:2px solid #51605e;border-radius:50%;background:#121819;box-shadow:inset 0 0 0 5px #1e2727,0 8px 20px #0006;}
.alarm-dial i {position:absolute;left:50%;top:50%;width:1px;height:5px;background:#84918d;transform:rotate(var(--angle)) translateY(-63px);transform-origin:0 0;}
.alarm-dial i.major {height:9px;width:2px;background:var(--text);}
.dial-brand {position:absolute;top:27%;width:100%;text-align:center;color:var(--muted);font-size:8px;letter-spacing:.18em;}
.clock-hand {position:absolute;bottom:50%;left:50%;width:3px;transform-origin:50% 100%;border-radius:3px;background:var(--text);}
.clock-hand.hour {height:27%;width:4px;transform:translateX(-50%) rotate(var(--hour,0deg));}
.clock-hand.minute {height:36%;transform:translateX(-50%) rotate(var(--minute,0deg));}
.clock-hand.second {height:40%;width:1px;background:var(--accent);transform:translateX(-50%) rotate(var(--second,0deg));}
.clock-pin {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--accent);}
#sleepClockTime {display:block;font-size:clamp(26px,5vw,43px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:.05em;}

.alarm-picker {text-align:center;}
.alarm-readout {display:block;font-size:30px;font-weight:750;font-variant-numeric:tabular-nums;margin:4px 0;}
.alarm-picker-controls {display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:8px 0;}
.alarm-picker button {background:var(--bg);color:var(--text);padding:5px 8px;}
.alarm-picker button[aria-pressed="true"] {background:var(--accent);color:#171d17;}
.alarm-picker-face {position:relative;width:200px;height:200px;margin:12px auto;border:1px solid var(--line);border-radius:50%;background:#121819;}
.alarm-picker-face button {position:absolute;left:50%;top:50%;width:32px;height:32px;padding:0;border-radius:50%;transform:translate(-50%,-50%) rotate(var(--tick)) translateY(-78px) rotate(calc(-1 * var(--tick)));}
.picker-hand {position:absolute;bottom:50%;left:calc(50% - 1px);width:2px;height:65px;background:var(--accent);transform-origin:50% 100%;pointer-events:none;}

/* Matchday chronograph */
#sleepAlarmForm fieldset {padding:16px 8px;border-radius:14px;background:linear-gradient(145deg,#212a2a,#151a1d);}
#sleepAlarmForm legend {padding:0 8px;font-weight:750;}
.alarm-readout {font:700 clamp(24px,5vw,36px) ui-monospace,monospace;letter-spacing:.07em;color:var(--accent);}
.alarm-picker-face {width:min(218px,100%);height:auto;aspect-ratio:1;container-type:inline-size;border:1px solid #83918a;background:radial-gradient(circle at 30% 18%,#283331,#121819 68%);box-shadow:0 0 0 3px #151a1b,0 0 0 4px #4c5753,inset 0 0 0 6px #0d1214,0 10px 24px #0007;margin:19px auto;}
.alarm-picker-face::before {content:"";position:absolute;inset:9px;border-radius:50%;background:repeating-conic-gradient(#a9b8af 0deg .6deg,transparent .6deg 6deg);mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));pointer-events:none;}
.picker-brand {position:absolute;top:33%;left:0;right:0;color:#b0bdb5;font-size:8px;letter-spacing:.24em;pointer-events:none;}
.alarm-picker-face button {width:15cqw;height:15cqw;font-size:clamp(10px,6cqw,14px);background:transparent;font-variant-numeric:tabular-nums;transform:translate(-50%,-50%) rotate(var(--tick)) translateY(-37cqw) rotate(calc(-1 * var(--tick)));}
.alarm-picker-face button:hover {background:#36453c;}
.alarm-picker-face button[aria-pressed="true"] {background:var(--accent);color:#151b17;box-shadow:0 0 12px #dfeeaa55;}
.picker-hand {height:32%;width:3px;border-radius:3px;background:linear-gradient(var(--accent),#758660);}
.alarm-picker-face .clock-pin {border:2px solid #e9f2cd;background:#526049;pointer-events:none;}
.alarm-picker-controls button {border:1px solid var(--line);border-radius:7px;font-size:12px;}
#stopRingingAlarm {position:fixed;z-index:10000;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:13px 25px;border-radius:10px;box-shadow:0 5px 24px #0009;white-space:nowrap;}
</style>
</head>

<body>
<aside>
  <div class="brand">TOUCH<span>LINE</span></div>
  <div class="brand-sub">PLAYER PERFORMANCE WORKSPACE</div>
  <nav id="nav" aria-label="Main navigation"></nav>
</aside>

<main>
  <header>
    <div>
      <div class="eyebrow">TRAIN · REFLECT · GROW</div>
      <div class="small" id="todayLabel"></div>
    </div>

    <div class="actions">
      <button class="secondary" id="exportButton">백업</button>
      <button class="secondary" id="importButton">가져오기</button>
      <input type="file" id="backupFile" accept=".json,application/json" hidden>
      <select id="languageButton" aria-label="Language / 언어"><option value="ko">한국어</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select>
    </div>
  </header>

  <div class="page-intro">
    <svg class="pitch-markings" viewBox="0 0 360 200" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="12" y="12" width="336" height="176" rx="2"/><path d="M180 12v176M12 53h54v94H12m336-94h-54v94h54M12 77h20v46H12m336-46h-20v46h20"/><circle cx="180" cy="100" r="31"/><path d="M66 79a28 28 0 0 1 0 42m228-42a28 28 0 0 0 0 42"/></g><circle cx="180" cy="100" r="3" fill="currentColor"/></svg>
    <div class="pitch-kicker" aria-hidden="true">TOUCHLINE <span></span> PLAYER PERFORMANCE</div>
    <h1 id="pageTitle">TOUCHLINE</h1>
    <p id="pageDescription" class="muted"></p>
  </div>

  <div class="layout">
    <div id="content" class="primary"></div>

    <section class="card word-rail">
      <div class="eyebrow">DAILY WORD</div>
      <h2 id="wordTitle" style="margin-top:12px"></h2>
      <div id="wordContent" aria-live="polite"></div>
    </section>
  </div>

  <footer id="footer"></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================
   기본 설정
========================================= */

const $ = id => document.getElementById(id);
const KEY = "touchline-v1";

let lang = "ko";
let page = "overview";
let dirty = false;
let activeMatch = "";
let videoURL = null;
let selectedDay = dayKey(new Date());
let currentMonth = new Date();

currentMonth.setDate(1);

const emptyData = () => ({
  version:1,
  sessions:[],
  customPlans:[],
  videoDescriptions:{},
  matches:[],
  recovery:[],
  journals:[],
  gratitude:[],
  tags:[],
  reactions:[],
  personalGoals:{
    short:"",
    long:"",
    ultimate:""
  }
});

let db = emptyData();

function tr(ko,en) {
  return lang === "ko" ? ko : en;
}

function dayKey(date) {
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function uid() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function notify(message) {
  $("toast").textContent = message;
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => {
    $("toast").textContent = "";
  },3500);
}

function normalize(source) {
  const result = emptyData();

  for(const key of [
    "sessions","matches","recovery",
    "journals","gratitude","tags","reactions","customPlans"
  ]) {
    if(Array.isArray(source[key])) {
      result[key] = source[key].filter(
        item => item && typeof item === "object"
      );
    }
  }

  if(source.personalGoals &&
     typeof source.personalGoals === "object") {
    for(const key of ["short","long","ultimate"]) {
      result.personalGoals[key] =
        typeof source.personalGoals[key] === "string"
          ? source.personalGoals[key] : "";
    }
  }

  if(source.videoDescriptions && typeof source.videoDescriptions === "object") {
    for(const id of ["dribble","shoot","pass","reaction"]) {
      if(typeof source.videoDescriptions[id] === "string") result.videoDescriptions[id] = source.videoDescriptions[id];
    }
  }
  return result;
}

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if(saved && typeof saved === "object") {
    db = normalize(saved);
  }
} catch(error) {
  console.warn("Unable to load saved records.",error);
}

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(db));
    dirty = false;
    return true;
  } catch(error) {
    notify(tr(
      "저장 실패: 백업 버튼으로 기록을 보관하세요.",
      "Storage failed. Export a backup."
    ));
    return false;
  }
}

function canLeave() {
  return !dirty || confirm(tr(
    "저장하지 않은 내용을 버리고 이동할까요?",
    "Discard unsaved changes?"
  ));
}

function field(label,name,type="text",value="",extra="") {
  return `
    <label>
      ${label}
      <input
        type="${type}"
        name="${name}"
        value="${esc(value)}"
        ${extra}
      >
    </label>
  `;
}

function area(label,name,value="",extra="") {
  return `
    <label>
      ${label}
      <textarea
        name="${name}"
        maxlength="5000"
        ${extra}
      >${esc(value)}</textarea>
    </label>
  `;
}

function removeButton(collection,id) {
  return `
    <button
      class="danger"
      data-remove="${collection}"
      data-id="${esc(id)}"
      type="button"
    >${tr("삭제","Delete")}</button>
  `;
}

function emptyMessage() {
  return `<p class="muted">${tr(
    "아직 기록이 없습니다.",
    "No records yet."
  )}</p>`;
}

const names = {
  overview:["대시보드","Overview"],
  schedule:["훈련 일정 · 일지","Schedule & journal"],
  matches:["경기 기록 · 분석","Matches & analysis"],
  recovery:["수면 시간","Sleep hours"],
  programs:["훈련 프로그램","Programs"],
  growth:["성장 분석","Progress"],
  video:["영상 리뷰","Video review"]
};

/* =========================================
   화면
========================================= */

const shellLocales = {"es": ["Resumen", "Calendario y diario", "Partidos y análisis", "Horas de sueño", "Programas de entrenamiento", "Progreso", "Análisis de vídeo", "Exportar copia", "Importar", "Registra tu entrenamiento de hoy y elige algo que mejorar para el próximo partido."], "fr": ["Tableau de bord", "Planning et journal", "Matchs et analyse", "Durée du sommeil", "Programmes d’entraînement", "Progression", "Analyse vidéo", "Exporter la sauvegarde", "Importer", "Note ton entraînement du jour et choisis un point à améliorer pour le prochain match."], "de": ["Übersicht", "Trainingsplan und Tagebuch", "Spiele und Analyse", "Schlafdauer", "Trainingsprogramme", "Fortschritt", "Videoanalyse", "Sicherung exportieren", "Importieren", "Halte dein heutiges Training fest und wähle einen Punkt, den du im nächsten Spiel verbessern möchtest."], "it": ["Panoramica", "Calendario e diario", "Partite e analisi", "Ore di sonno", "Programmi di allenamento", "Progressi", "Analisi video", "Esporta backup", "Importa", "Registra l’allenamento di oggi e scegli un aspetto da migliorare nella prossima partita."]};
const navName = key => shellLocales[lang]?.[Object.keys(names).indexOf(key)] ?? names[key][lang === "ko" ? 0 : 1];

function render() {
  dirty = false;

  if(videoURL) {
    URL.revokeObjectURL(videoURL);
    videoURL = null;
  }

  document.documentElement.lang = lang;

  $("languageButton").value = lang;
  $("exportButton").textContent = shellLocales[lang]?.[7] ?? tr("백업 내보내기","Export");
  $("importButton").textContent = shellLocales[lang]?.[8] ?? tr("가져오기","Import");

  $("todayLabel").textContent = new Date().toLocaleDateString(
    lang === "en" ? "en-GB" : lang
  );

  $("pageTitle").textContent = navName(page);

  $("pageDescription").textContent = shellLocales[lang]?.[9] ?? tr(
    "오늘의 실천을 기록하고, 다음 경기에서 바꿀 한 가지를 찾아보세요.",
    "Record today's work and find one thing to improve next match."
  );

  $("nav").innerHTML = Object.entries(names).map(([key,label]) => `
    <button
      data-page="${key}"
      class="${key === page ? "active" : ""}"
      ${key === page ? 'aria-current="page"' : ""}
    >${navName(key)}</button>
  `).join("");

  const screens = {
    overview:overviewView,
    schedule:scheduleView,
    matches:matchesView,
    recovery:recoveryView,
    programs:programsView,
    growth:growthView,
    video:videoView
  };

  $("content").innerHTML = screens[page]();

  $("footer").textContent = tr(
    "현재 브라우저에 저장되는 개인용 도구입니다. 정기적으로 백업하세요. 의료 진단·자동 AI 영상 분석·기기 간 동기화는 제공하지 않습니다.",
    "Personal browser-based workspace. Export backups regularly. No medical diagnosis, automated video analysis or cross-device sync."
  );

  bindCommon();
  renderWord();

  if(page === "overview") bindGoals();
  if(page === "schedule") bindSchedule();
  if(page === "matches") bindMatches();
  if(page === "recovery") bindRecovery();
  if(page === "programs") bindPrograms();
  if(page === "video") bindVideo();
}

function bindCommon() {
  document.querySelectorAll("[data-page]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;
      page = button.dataset.page;
      render();
    };
  });

  document.querySelectorAll("[data-remove]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;
      if(!confirm(tr("이 기록을 삭제할까요?","Delete this record?"))) return;

      const key = button.dataset.remove;
      db[key] = db[key].filter(
        item => String(item.id) !== button.dataset.id
      );

      save();
      render();
    };
  });

  document.querySelectorAll("form").forEach(form => {
    form.addEventListener("input",() => {
      dirty = true;
    });
  });
}

/* =========================================
   작은 목표 카드 + 대시보드
========================================= */

function overviewView() {
  const goals = db.personalGoals;
  const completed = db.sessions.filter(s => s.done);
  const minutes = completed.reduce(
    (total,s) => total + (Number(s.minutes) || 0),0
  );

  const upcoming = db.sessions
    .filter(s => !s.done && s.date >= dayKey(new Date()))
    .sort((a,b) => String(a.date).localeCompare(String(b.date)))
    .slice(0,3);

  return `
    <section class="card">
      <details id="goalsDetails">
        <summary class="goal-summary">
          <span class="goal-title">💡 🔑 MY GOALS</span>
          <span class="goal-preview">
            ${esc(goals.short || tr(
              "이번 달 목표를 적어보세요.",
              "Add your goal for this month."
            ))}
          </span>
        </summary>

        <form id="goalsForm" style="margin-top:20px">
          ${area(tr("단기적 목표","Short-term goal"),"short",goals.short)}
          ${area(tr("장기적 목표","Long-term goal"),"long",goals.long)}
          ${area(tr("궁극적 목표","Ultimate goal"),"ultimate",goals.ultimate)}
          <button>${tr("목표 저장","Save goals")}</button>
        </form>
      </details>
    </section>

    <div class="stats">
      <div class="card">
        <span class="small">${tr("완료 훈련","Completed sessions")}</span>
        <div class="number">${completed.length}</div>
      </div>
      <div class="card">
        <span class="small">${tr("훈련 시간 · 분","Training minutes")}</span>
        <div class="number">${minutes}</div>
      </div>
      <div class="card">
        <span class="small">${tr("경기 기록","Matches")}</span>
        <div class="number">${db.matches.length}</div>
      </div>
    </div>

    <section class="card">
      <h2>${tr("다가오는 훈련","Upcoming training")}</h2>

      ${upcoming.map(s => `
        <div class="record">
          <strong>${esc(s.name)}</strong>
          <span class="small">
            ${esc(s.date)} · ${Number(s.minutes) || 0} min
          </span>
        </div>
      `).join("") || emptyMessage()}

      <button data-page="schedule" style="margin-top:15px">
        ${tr("달력 · 오늘의 일지 열기","Open calendar & journal")}
      </button>
    </section>
  `;
}

function bindGoals() {
  $("goalsForm").onsubmit = event => {
    event.preventDefault();

    const values = new FormData(event.target);
    const goals = {};

    ["short","long","ultimate"].forEach(key => {
      goals[key] = String(values.get(key) || "").trim();
    });

    db.personalGoals = goals;

    if(save()) {
      render();
      notify(tr("목표를 저장했습니다.","Goals saved."));
    }
  };
}

/* =========================================
   월간 달력 · 일지 · 감사
========================================= */

function scheduleView() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const first = new Date(year,month,1).getDay();
  const days = new Date(year,month+1,0).getDate();

  let cells = "";

  for(let i=0;i<first;i++) {
    cells += '<div class="day blank" aria-hidden="true"></div>';
  }

  for(let n=1;n<=days;n++) {
    const key = dayKey(new Date(year,month,n));
    const sessions = db.sessions.filter(s => s.date === key);
    const hasJournal = db.journals.some(j => j.date === key);
    const hasThanks = db.gratitude.some(g => g.date === key);

    cells += `
      <div class="calendar-day-cell">
      <button
        class="day ${key === selectedDay ? "selected" : ""}"
        data-day="${key}"
        aria-label="${key}"
        aria-pressed="${key === selectedDay}"
      >
        <span class="day-number ${
          key === dayKey(new Date()) ? "today" : ""
        }">${n}</span>

        ${sessions.slice(0,2).map(s => `
          <span class="event ${s.done ? "done" : ""}">
            ${s.done ? "✓ " : ""}${esc(s.name)}
          </span>
        `).join("")}

        ${sessions.length > 2
          ? `<span class="small">+${sessions.length-2}</span>` : ""}

        ${hasJournal
          ? `<span class="mark">✎ ${tr("일지","Journal")}</span>` : ""}

        ${hasThanks
          ? `<span class="mark">♡ ${tr("감사","Gratitude")}</span>` : ""}
      </button>
      <button type="button" class="day-journal-add" data-journal-day="${key}" aria-controls="calendarJournal" aria-label="${key} · ${tr("훈련 일지 열기","Open training journal")}">+</button>
      </div>
    `;
  }

  const tail = (7-(first+days)%7)%7;

  for(let i=0;i<tail;i++) {
    cells += '<div class="day blank" aria-hidden="true"></div>';
  }

  const journal = db.journals.find(j => j.date === selectedDay) || {};
  const thanks = db.gratitude.find(g => g.date === selectedDay) || {};
  const items = Array.isArray(thanks.items) ? thanks.items : [];
  const sessions = db.sessions.filter(s => s.date === selectedDay);

  return `
    <section class="card">
      <div class="toolbar">
        <div>
          <div class="eyebrow">MONTHLY SCHEDULE</div>
          <h2 style="margin:10px 0">
            ${currentMonth.toLocaleDateString(
              lang === "en" ? "en-GB" : lang,
              {year:"numeric",month:"long"}
            )}
          </h2>
        </div>

        <div class="actions">
          <button class="secondary" id="previousMonth"
            aria-label="${tr("이전 달","Previous month")}">‹</button>
          <button class="secondary" id="todayButton">
            ${tr("오늘","Today")}
          </button>
          <button class="secondary" id="nextMonth"
            aria-label="${tr("다음 달","Next month")}">›</button>
        </div>
      </div>

      <p class="small">
        ${tr(
          "날짜 칸에 마우스를 올리면 나타나는 +로 일지를 작성하세요.",
          "Hover over a date and press + to write its journal entry."
        )}
      </p>

      <div class="scroll">
        <div class="week">
          ${tr(
            "일,월,화,수,목,금,토",
            "Sun,Mon,Tue,Wed,Thu,Fri,Sat"
          ).split(",").map(d => `<span>${d}</span>`).join("")}
        </div>
        <div class="calendar">${cells}</div>
      </div>
      <div id="calendarJournal" hidden style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
        <h2>${tr("훈련 일지","Training journal")} · ${selectedDay}</h2>
        <form id="journalForm">
          ${field(tr("수면 시간 · 선택","Sleep hours · optional"),"sleep","number",
            sleepByDate().get(selectedDay)?.hours ?? "",'min="0" max="24" step="0.1"')}
          <label>
            ${tr("컨디션","Condition")}
            <select name="mood">
              ${[
                ["great","좋음","Great"],
                ["normal","보통","Okay"],
                ["tired","피곤함","Tired"]
              ].map(([value,ko,en]) => `
                <option value="${value}"
                  ${journal.mood === value ? "selected" : ""}>
                  ${tr(ko,en)}
                </option>
              `).join("")}
            </select>
          </label>

          ${field(tr("오늘의 목표","Daily goal"),"goal",
            "text",journal.goal || "",'maxlength="200"')}

          ${area(tr("훈련 내용 · 느낀 점","Training & reflections"),
            "body",journal.body || "","required")}

          ${area(tr("다음 훈련에서 개선할 점","Next session focus"),
            "next",journal.next || "")}

          <button>${tr("일지 저장","Save journal")}</button>
        </form>
      </div>
    </section>

    <h2>${selectedDay}</h2>

    <div class="grid">
      <section class="card">
        <h2>${tr("선택한 날의 훈련","Selected day's training")}</h2>

        ${sessions.map(s => `
          <div class="record">
            <div>
              <strong>${esc(s.name)}</strong>
              <div class="small">
                ${Number(s.minutes) || 0} min · RPE ${Number(s.rpe) || 0}
              </div>
            </div>
            <div class="actions">
              <button class="secondary" data-complete="${esc(s.id)}">
                ${s.done ? tr("완료 ✓","Done ✓") : tr("완료 처리","Mark done")}
              </button>
              ${removeButton("sessions",s.id)}
            </div>
          </div>
        `).join("") || emptyMessage()}

        <details style="margin-top:20px">
          <summary style="cursor:pointer;color:var(--accent)">
            + ${tr("훈련 추가","Add training")}
          </summary>

          <form id="sessionForm">
            ${field(tr("훈련 이름","Session name"),"name","text",
              "",'required maxlength="100"')}
            ${field(tr("시간 · 분","Minutes"),"minutes","number",
              60,'required min="1" max="600"')}
            ${field("RPE · 1–10","rpe","number",
              5,'required min="1" max="10"')}
            <button>${tr("일정 추가","Add session")}</button>
          </form>
        </details>
      </section>

    </div>

    <section class="card">
      <div class="eyebrow">END YOUR DAY WITH GRATITUDE</div>
      <details class="writing-toggle" style="margin-top:12px">
        <summary>${tr("오늘 감사한 일 세 가지 적기","Write three things I am thankful for")}</summary>
      <p class="small">
        ${tr("작은 일도 좋습니다. 하나부터 적어도 괜찮아요.",
          "Small moments count. It is okay to start with one.")}
      </p>

      <form id="gratitudeForm">
        ${[0,1,2].map(i => area(
          tr("감사한 일","Something I am thankful for")+" "+(i+1),
          "thanks"+i,
          items[i] || ""
        )).join("")}

        ${field(tr("말씀을 읽고 남기는 한 줄 · 선택","Scripture reflection · optional"),
          "reflection","text",thanks.reflection || "",'maxlength="1000"')}

        <button>${tr("감사 기록 저장","Save gratitude")}</button>
      </form>
      </details>
    </section>
  `;
}

function bindSchedule() {
  function move(offset) {
    if(!canLeave()) return;

    currentMonth = new Date(
      currentMonth.getFullYear(),
      currentMonth.getMonth()+offset,
      1
    );

    render();
  }

  $("previousMonth").onclick = () => move(-1);
  $("nextMonth").onclick = () => move(1);

  $("todayButton").onclick = () => {
    if(!canLeave()) return;
    selectedDay = dayKey(new Date());
    currentMonth = new Date();
    currentMonth.setDate(1);
    render();
  };

  document.querySelectorAll("[data-day]").forEach(button => {
    button.onclick = () => {
      if(!canLeave()) return;
      selectedDay = button.dataset.day;
      render();
    };
  });

  document.querySelectorAll("[data-complete]").forEach(button => {

      if(!canLeave()) return;

      const session = db.sessions.find(

      );

      session.done = !session.done;

      id:uid(),
      date:selectedDay,
      name,
      minutes:Number(values.get("minutes")),
      rpe:Number(values.get("rpe")),
      done:false
    });

      render();
      notify(tr("훈련을 추가했습니다.","Training added."));

      render();
      $("calendarJournal").hidden = false;

  });

  $("journalForm").onsubmit = event => {
    event.preventDefault();

    const record = Object.fromEntries(new FormData(event.target));
    if(!record.body.trim()) return;
    record.sleep = record.sleep === "" ? null : Number(record.sleep);

    record.date = selectedDay;
    record.updatedAt = new Date().toISOString();

    db.journals = db.journals.filter(j => j.date !== selectedDay);
    db.journals.push(record);

    if(save()) {
      render();
      notify(tr("일지를 저장했습니다.","Journal saved."));
    }
  };

  $("gratitudeForm").onsubmit = event => {
    event.preventDefault();

    const values = new FormData(event.target);
    const items = [0,1,2].map(
      i => String(values.get("thanks"+i) || "").trim()
    );

    const reflection = String(values.get("reflection") || "").trim();

    if(!items.some(Boolean) && !reflection) {
      notify(tr("한 항목 이상 작성하세요.","Write at least one entry."));
      return;
    }

    db.gratitude = db.gratitude.filter(g => g.date !== selectedDay);
    db.gratitude.push({
      date:selectedDay,
      items,
      reflection,
      updatedAt:new Date().toISOString()
    });

    if(save()) {
      render();
      notify(tr("감사 기록을 저장했습니다.","Gratitude saved."));
    }
  };
}

function bindMatches() {
  document.querySelectorAll("[data-review-match]").forEach(button => {
    button.onclick = () => {
      if(activeMatch !== button.dataset.reviewMatch) {
        if(!canLeave()) return;
        activeMatch = button.dataset.reviewMatch;
        render();
      }
      $("matchReviewPanel")?.scrollIntoView({block:"start"});
      $("matchSelect")?.focus({preventScroll:true});
    };
  });
  $("matchForm").onsubmit = event => {
    event.preventDefault();

    const values = Object.fromEntries(new FormData(event.target));
    values.opponent = values.opponent.trim();
    if(!values.opponent) return;

    ["minutes","goals","assists"].forEach(key => {
      values[key] = Number(values[key]);
    });

    values.id = uid();
    db.matches.push(values);
    activeMatch = values.id;

    if(save()) render();
  };

  if(!$("reviewForm")) return;

  const form = $("reviewForm");
  form.elements.namedItem("position").addEventListener("change",event=>{
    form.querySelectorAll("[data-position]").forEach(group=>group.hidden = group.dataset.position !== event.target.value);
  });
  $("matchTrainingForm").onsubmit = event => {
    event.preventDefault();
    const values = new FormData(event.currentTarget);
    const name = String(values.get("name") || "").trim();
    const date = String(values.get("date") || "");
    const minutes = Number(values.get("minutes")), rpe = Number(values.get("rpe"));
    if(!name || !date || !Number.isInteger(minutes) || minutes<1 || minutes>600 || !Number.isInteger(rpe) || rpe<1 || rpe>10) { notify(tr("훈련 입력값을 확인하세요.","Check the training details.")); return; }
    const session = {id:uid(),date,name,minutes,rpe,done:false,sourceMatchId:activeMatch};
    const wasDirty = dirty;
    db.sessions.push(session);
    if(!save()) {db.sessions.pop();return;}
    event.currentTarget.reset();
    dirty = wasDirty;
    notify(tr("선택한 날짜의 훈련 일정에 추가했습니다.","Added to the training schedule for the selected date."));
  };


  function ratios() {
    function rate(success,attempts) {
      const a = form.elements.namedItem(success).value;
      const b = form.elements.namedItem(attempts).value;

      return a !== "" && b !== "" &&
        Number(b) > 0 && Number(a) <= Number(b)
          ? (Number(a)/Number(b)*100).toFixed(1)+"%"
          : "—";
    }

    $("ratios").textContent =
      tr("패스 성공률","Pass completion")+": "+
      rate("passesCompleted","passesAttempted")+" · "+
      tr("유효 슈팅 비율","Shots on target")+": "+
      rate("shotsOnTarget","shots")+" · "+
      tr("경합 성공률","Duels won")+": "+
      rate("duelsWon","duelsAttempted");
  }

  ratios();
  form.addEventListener("input",ratios);

  $("matchSelect").onchange = event => {
    if(!canLeave()) {
      event.target.value = activeMatch;
      return;
    }
    activeMatch = event.target.value;
    render();
  };

  form.onsubmit = event => {
    event.preventDefault();

    const values = new FormData(form);
    const review = {};

    reviewGroups.forEach(group => {
      group[2].forEach(([key]) => {
        review[key] = String(values.get(key) || "").trim();
      });
    });

    countFields.forEach(([key]) => {
      const value = values.get(key);
      if(value !== "") review[key] = Number(value);
    });

    for(const [success,attempts] of [
      ["passesCompleted","passesAttempted"],
      ["shotsOnTarget","shots"],
      ["duelsWon","duelsAttempted"]
    ]) {
      if(review[success] !== undefined &&
         review[attempts] !== undefined &&
         review[success] > review[attempts]) {
        notify(tr(
          "성공 수는 시도 수보다 클 수 없습니다.",
          "Successful counts cannot exceed attempts."
        ));
        return;
      }
    }

    const position = values.get("position");
    if(Object.hasOwn(positionChecks,position)) {
      review.position = position;
      review.positionChecks = values.getAll("positionCheck").filter(id=>positionChecks[position].some((_,i)=>id === position+"-"+i));
    }
    review.updatedAt = new Date().toISOString();

    const match = db.matches.find(m => m.id === activeMatch);
    if(!match) return;
    match.review = review;

    if(save()) notify(tr("분석을 저장했습니다.","Analysis saved."));
  };

  $("deleteReview").onclick = () => {
    if(!confirm(tr("분석만 삭제할까요?","Delete analysis only?"))) return;

    const match = db.matches.find(m => m.id === activeMatch);
    if(!match) return;

    delete match.review;
    save();
    render();
  };
}

function sleepByDate() {
  const days = new Map();
  for(const row of [...db.recovery,...db.journals]) {
    if(!row || typeof row.date !== "string" || row.sleep == null || String(row.sleep).trim() === "") continue;
    const hours = Number(row.sleep);
    if(!Number.isFinite(hours) || hours < 0 || hours > 24) continue;
    const stamp = row.updatedAt || "";
    if(!days.has(row.date) || stamp >= days.get(row.date).stamp) days.set(row.date,{hours,stamp});
  }
  return days;
}

function sleepSummary() {
  const today = new Date();
  const days = sleepByDate();
  const end = dayKey(today);
  const format = new Intl.NumberFormat(lang,{maximumFractionDigits:1});
  return `<section class="card"><h2>${tr("수면 통계","Sleep statistics")}</h2>
    <div class="sleep-stat-grid">${[7,30].map(n => {
      const start = new Date(today);
      start.setDate(start.getDate()-n+1);
      const first = dayKey(start);
      const values = [...days].filter(([date]) => date >= first && date <= end).map(([,row]) => row.hours);
      const total = values.reduce((a,b) => a+b,0);
      const avg = values.length ? total / values.length : null;
      return `<div class="sleep-stat"><h3>${n === 7 ? tr("최근 7일","Last 7 days") : tr("최근 30일","Last 30 days")}</h3>
        <div class="sleep-ring" style="--sleep-angle:${(avg ?? 0)/24*360}deg" aria-hidden="true"><strong>${avg === null ? "—" : format.format(avg)+" h"}</strong></div>
        <p>${values.length ? tr("평균","Average")+" <strong>"+format.format(total/values.length)+" h</strong> · "+tr("합계","Total")+" "+format.format(total)+" h" : tr("수면 기록 없음","No sleep records")}</p>
        <p class="small">${tr("기록한 날","Days logged")}: ${values.length}/${n}</p></div>`;
    }).join("")}</div>
    <p class="small">${tr("원의 색칠된 부분은 하루 24시간 중 평균 수면 시간입니다. 기록한 날만 평균에 포함됩니다.","The filled arc shows average sleep out of 24 hours. Only logged days count.")}</p></section>`;
}

const alarmSounds = Object.create(null);
const activeAlarmNodes = new Set();
function stopAlarmAudio() {
  for(const node of activeAlarmNodes) {try {node.stop();} catch {}}
  activeAlarmNodes.clear();

}
function trackAlarmNode(node) {
  activeAlarmNodes.add(node);

function soundStorage(action,key,file) {
  return new Promise((resolve,reject) => {
    const request = indexedDB.open(KEY+"-alarm-sounds",1);
    request.onupgradeneeded = () => request.result.createObjectStore("audio");
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      const storeDb = request.result;
      const tx = storeDb.transaction("audio",action === "get" ? "readonly" : "readwrite");
      const store = tx.objectStore("audio");
      const work = action === "get" ? store.get(key) : action === "put" ? store.put(file,key) : store.delete(key);
      tx.oncomplete = () => {storeDb.close(); resolve(work.result);};
      tx.onabort = () => {storeDb.close(); reject(tx.error);};
    };
  });
}
function unlockAlarmAudio() {

  const source = sleepAudio.createBufferSource();
  source.buffer = alarmSounds[key].buffer;
  source.connect(sleepAudio.destination);
  source.start(0,0,preview ? 5 : 20);
  trackAlarmNode(source);
  showStopAlarm();

}
function bindAlarmSounds() {
  for(const key of ["wake","bed"]) {
    const input = document.querySelector(`[data-alarm-file="${key}"]`);
    const status = document.querySelector(`[data-sound-status="${key}"]`);
    const paint = () => {status.textContent = alarmSounds[key]?.file.name || tr("기본 소리","Default sound");};
    paint();

      const file = input.files[0];
      if(!file) return;
      if(file.size > 25_000_000) {notify(tr("25MB 이하의 오디오 파일을 선택하세요.","Choose an audio file under 25 MB.")); input.value=""; return;}

        const Audio = window.AudioContext || window.webkitAudioContext;
        if(!Audio) throw new Error("Audio unavailable");

        const buffer = await sleepAudio.decodeAudioData(await file.arrayBuffer());
        alarmSounds[key] = {file,buffer}; paint();
        try { await soundStorage("put",key,file); }
        catch { status.textContent = file.name + " · " + tr("이 탭에서만 사용 가능","Available in this tab only"); }
      } catch {paint(); notify(tr("오디오 파일을 읽을 수 없습니다. MP3 파일을 다시 선택해 주세요.","Could not read the audio file. Try selecting the MP3 again."));}

      catch {notify(tr("브라우저에서 소리를 재생할 수 없습니다.","The browser could not play the sound."));}
    };
    document.querySelector(`[data-sound-reset="${key}"]`).onclick = async () => {
      try {await soundStorage("delete",key); delete alarmSounds[key]; paint();}
      catch {notify(tr("기본 소리로 변경하지 못했습니다.","Could not restore the default sound."));}
    };
  }
}
Promise.all(["wake","bed"].map(async key => {
  try {
    const file = await soundStorage("get",key);
    if(!file || alarmSounds[key]) return;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if(!Audio) return;
    sleepAudio ||= new Audio();
    const buffer = await sleepAudio.decodeAudioData(await file.arrayBuffer());

    const label = document.querySelector(`[data-sound-status="${key}"]`);

  } catch {}
}));
function ringWakeAlarm(key) {
  if(sleepAudio?.state !== "running") return;
  for(let i=0;i<(key === "bed" ? 2 : 5);i++) {
    const tone = sleepAudio.createOscillator();
    const gain = sleepAudio.createGain();
    const t = sleepAudio.currentTime + i*.45;
    tone.frequency.value = key === "bed" ? 440 : 740;
    gain.gain.setValueAtTime(.16,t);
    gain.gain.exponentialRampToValueAtTime(.001,t+.28);
    tone.connect(gain).connect(sleepAudio.destination);
    trackAlarmNode(tone);
    tone.start(t); tone.stop(t+.3);
  }
}
function checkSleepAlarm() {
  const now = new Date();
  const current = now.getHours()*60 + now.getMinutes();
  const today = dayKey(now);
  const messages = [];
  for(const key of ["wake","bed"]) {
    if(!sleepAlarm[key]?.enabled || sleepAlarmLast[key] === today) continue;
    const [hours,minutes] = String(sleepAlarm[key].time).split(":").map(Number);
    const delay = current - (hours*60+minutes);
    if(!Number.isFinite(delay) || delay < 0 || delay > 5) continue;
    if(!playAlarmSound(key)) {
      const blocked = key+"-blocked";
      if(sleepAlarmLast[blocked] !== today) {
        sleepAlarmLast[blocked] = today;
        notify(tr("알람 시간입니다. 소리를 들으려면 수면 시간에서 알람 소리 켜기를 누르세요.","Alarm due. Open Sleep hours and enable alarm audio."));
      }
      continue;
    }
    sleepAlarmLast[key] = today;
    messages.push(key === "wake" ? tr("일어날 시간이에요!","Time to wake up!") : tr("잠잘 준비를 시작할 시간이에요.","Time to get ready for bed."));
  }
  if(messages.length) notify(messages.join(" · "));
}

function bindAlarmPicker(picker) {
  const [hour,minute] = picker.querySelectorAll('input[type="hidden"]');
  let mode = "hour";
  const pad = n => String(n).padStart(2,"0");
  function paint() {
    const h = Number(hour.value), m = Number(minute.value);
    picker.querySelector("output").textContent = hour.value+":"+minute.value;
    picker.querySelector(".picker-hand").style.rotate = (mode === "hour" ? h%12*30 : m*6)+"deg";
    for(const btn of picker.querySelectorAll("[data-tick]")) {
      const i = Number(btn.dataset.tick);
      btn.textContent = mode === "hour" ? i || 12 : pad(i*5);
      btn.setAttribute("aria-pressed", String(mode === "hour" ? h%12 === i : m === i*5));
    }
    for(const btn of picker.querySelectorAll("[data-mode],[data-period]")) btn.setAttribute("aria-pressed",String(btn.dataset.mode ? btn.dataset.mode === mode : Number(btn.dataset.period) === Math.floor(h/12)));
  }
  picker.onclick = event => {
    const btn = event.target.closest("button");
    if(!btn) return;
    if(btn.dataset.mode) mode = btn.dataset.mode;
    if(btn.dataset.period != null) hour.value = pad(Number(hour.value)%12+Number(btn.dataset.period)*12);
    if(btn.dataset.tick != null) {
      const i = Number(btn.dataset.tick);
      if(mode === "hour") { hour.value = pad(Math.floor(Number(hour.value)/12)*12+i); mode = "minute"; }
      else minute.value = pad(i*5);
    }
    if(btn.dataset.step) {
      const total = (Number(hour.value)*60+Number(minute.value)+Number(btn.dataset.step)+1440)%1440;
      hour.value = pad(Math.floor(total/60)); minute.value = pad(total%60); mode = "minute";
    }
    paint();
  };
  paint();
}

    record.sleep = Number(record.sleep);

    const previous = db.recovery.find(r => r.date === record.date);

    record.updatedAt = new Date().toISOString();
    db.recovery = db.recovery.filter(r => r.date !== record.date);
    db.recovery.push(record);

    if(save()) render();
  };
}

  const paragraphs = body.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [body];
  return `<div class="training-description-content"><h3>${esc(title)}</h3>${paragraphs.map(sentence => `<p>${esc(sentence.trim())}</p>`).join("")}</div>`;
}

function growthView() {
  const rows = [];

  for(let i=3;i>=0;i--) {
    const end = new Date();
    end.setDate(end.getDate()-i*7);

    const start = new Date(end);
    start.setDate(start.getDate()-6);

    const from = dayKey(start);
    const to = dayKey(end);

    const sessions = db.sessions.filter(
      s => s.done && s.date >= from && s.date <= to
    );

    rows.push({
      from,to,
      count:sessions.length,
      minutes:sessions.reduce(
        (sum,s) => sum+(Number(s.minutes) || 0),0
      ),
      load:sessions.reduce(
        (sum,s) => sum+
          (Number(s.minutes) || 0)*(Number(s.rpe) || 0),0
      )
    });
  }

  return `
    <section class="card">
      <h2>${tr("최근 4주 훈련 요약","Last four weeks")}</h2>

      <div class="scroll">
        <table>
          <thead><tr>
            <th>${tr("기간","Period")}</th>
            <th>${tr("완료 수","Sessions")}</th>
            <th>${tr("시간 · 분","Minutes")}</th>
            <th>${tr("주관적 부하 · AU","Subjective load · AU")}</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.from} — ${r.to}</td>
                <td>${r.count}</td>
                <td>${r.minutes}</td>
                <td>${r.load}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <p class="small">
        ${tr(
          "부하 = 완료한 훈련의 시간 × 입력 RPE의 합입니다. 실력 향상이나 부상 위험을 판정하는 수치가 아닙니다.",

}

/* =========================================
   매일 다른 성경 말씀 · 한국어/영어
   온라인 공개 성경 데이터 사용
========================================= */

const BIBLE_BASE =
  "https://raw.githubusercontent.com/thiagobodruk/bible/master/json/";

let bibleData = null;
let bibleLoading = false;

/*
  날짜별 목록의 시작일.
  목록 끝에서는 처음으로 돌아가지 않습니다.
*/
const VERSE_START = "2026-11-03";

/*
  성실·용기·감사·사랑·협력 등을 돌아볼 수 있는
  장들을 포함합니다. 각 구절은 앞뒤 문맥과 함께 읽으세요.
*/
const readingChapters = {
  18:[1,19,23,27,34,46,62,91,100,103,121,139,145],
  19:[3,4,16,24,27],
  39:[5,6,7],
  42:[15],
  44:[12],
  45:[12,13],
  47:[5,6],
  48:[4,6],
  49:[2,3,4],
  50:[3],
  51:[5],
  57:[12,13],
  58:[1,3,4,5],
  59:[4,5]
};

/* 처음에 배치할 본문: 책 번호는 0부터 시작 */
const priorityVerses = [
  [49,4,13],
  [47,6,9],
  [19,16,3],
  [18,56,3],
  [51,5,18],
  [45,16,14],
  [18,23,1],
  [19,24,16],
  [18,119,105],
  [51,5,11],
  [19,27,17],
  [18,46,1],
  [50,3,23]
];

function serialDay(value) {
  const [year,month,day] = value.split("-").map(Number);
  return Date.UTC(year,month-1,day)/86400000;
}

function buildVerseList(ko,en) {
  const references = [...priorityVerses];

  for(const [book,chapters] of Object.entries(readingChapters)) {
    for(const chapter of chapters) {
      const korean = ko[Number(book)]?.chapters?.[chapter-1];
      const english = en[Number(book)]?.chapters?.[chapter-1];

      if(!Array.isArray(korean) ||
         !Array.isArray(english) ||
         korean.length !== english.length) continue;

      for(let verse=1;verse<=korean.length;verse++) {
        references.push([Number(book),chapter,verse]);
      }
    }
  }

  const seen = new Set();
  const result = [];

  for(const [book,chapter,verse] of references) {
    const key = [book,chapter,verse].join(":");
    if(seen.has(key)) continue;

    const korean = ko[book]?.chapters?.[chapter-1]?.[verse-1];
    const english = en[book]?.chapters?.[chapter-1]?.[verse-1];

    if(typeof korean !== "string" ||
       typeof english !== "string" ||
       !korean.trim() || !english.trim()) continue;

    seen.add(key);

    result.push({
      book,chapter,verse,
      koRef:ko[book].name+" "+chapter+":"+verse,
      enRef:en[book].name+" "+chapter+":"+verse,
      ko:korean,
      en:english
    });
  }

  return result;
}

async function loadBible() {
  if(bibleData || bibleLoading) return;

  bibleLoading = true;

  try {
    const files = ["ko_krv","en_kjv"];

    const books = await Promise.all(files.map(async code => {
      const response = await fetch(BIBLE_BASE+code+".json");
      if(!response.ok) throw new Error("Bible download failed");

      const json = await response.json();
      if(!Array.isArray(json) || json.length !== 66) {
        throw new Error("Invalid Bible data");
      }

      return json;
    }));

    bibleData = buildVerseList(books[0],books[1]);

    if(!bibleData.length) throw new Error("No readings");

  } catch(error) {
    console.warn("Unable to load scripture.",error);

  } finally {
    bibleLoading = false;
    renderWord();
  }
}

const wordLocales = {
  es:["es_rvr1960","Versículo del día","Cargando el versículo…","No se pudo cargar el texto de este versículo.","Reintentar","Reina-Valera 1960","Fuente del texto"],
  fr:["fr_apee","Verset du jour","Chargement du verset…","Impossible de charger le texte de ce verset.","Réessayer","Bible de l’Épée","Source du texte"],
  de:["de_sch1951","Bibelvers des Tages","Bibelvers wird geladen…","Dieser Bibelvers konnte nicht geladen werden.","Erneut versuchen","Schlachter 1951","Textquelle"],
  it:["it_irb20","Versetto del giorno","Caricamento del versetto…","Impossibile caricare il testo del versetto.","Riprova","Riveduta 2020","Fonte del testo"]
};
const wordBooks = new Map();
async function showLocalizedWord(verse,today,language) {
  const [code,,loading,error,retry,edition,source] = wordLocales[language];
  const target = $("wordContent");
  const token = Symbol();
  target.wordToken = token;
  const current = () => lang === language && target.wordToken === token;
  target.textContent = loading;
  try {
    if(!wordBooks.has(code)) wordBooks.set(code,fetch(BIBLE_BASE+code+".json").then(r=>{
      if(!r.ok) throw Error("Bible download failed");
      return r.json();
    }).catch(e=>{wordBooks.delete(code);throw e;}));
    const books = await wordBooks.get(code);
    const book = books[verse.book];
    const text = book?.chapters?.[verse.chapter-1]?.[verse.verse-1];
    if(typeof text !== "string" || !text.trim()) throw Error("Verse missing");
    if(current()) target.innerHTML = `<p class="small">${today}</p><strong class="word-ref">${esc(book.name)} ${verse.chapter}:${verse.verse}</strong><blockquote>${esc(text)}</blockquote><p class="small">${edition}</p><a class="small" href="https://github.com/thiagobodruk/bible/blob/master/json/${code}.json" target="_blank" rel="noopener noreferrer">${source}</a>`;
  } catch(e) {
    if(current()) {
      target.textContent = error + " ";
      const button = document.createElement("button");
      button.textContent = retry;
      button.onclick = renderWord;
      target.append(button);
    }
  }
}

function renderWord() {
  $("wordTitle").textContent = wordLocales[lang]?.[1] ?? tr("오늘의 말씀","Today's scripture");

  if(!bibleData) {
    $("wordContent").innerHTML = `
      <p class="small">
        ${bibleLoading
          ? tr("말씀을 불러오는 중입니다…","Loading scripture…")
          : tr(
              "말씀을 불러오지 못했습니다. 인터넷 연결을 확인하세요.",
              "Unable to load scripture. Check your connection."
            )}
      </p>
      ${!bibleLoading ? `
        <button class="secondary" id="retryBible">
          ${tr("다시 불러오기","Retry")}
        </button>
      ` : ""}
    `;

    if($("retryBible")) $("retryBible").onclick = loadBible;
    return;
  }

  const today = dayKey(new Date());
  const index = serialDay(today)-serialDay(VERSE_START);
  const verse = bibleData[index];

  if(!verse) {
    $("wordContent").innerHTML = `
      <p class="small">${today}</p>
      <p class="small">
        ${tr(
          "이 날짜의 말씀 목록을 추가해야 합니다. 이전 말씀을 반복하지 않습니다.",
          "The reading list needs extending for this date. Earlier readings are not repeated."
        )}
      </p>
    `;
    return;
  }

  if(wordLocales[lang]) { showLocalizedWord(verse,today,lang); return; }

  $("wordContent").innerHTML = `
    <p class="small">${today}</p>
    <strong class="word-ref">
      ${esc(tr(verse.koRef,verse.enRef))}
    </strong>
    <blockquote>${esc(tr(verse.ko,verse.en))}</blockquote>
    <p class="small">${tr("개역한글","King James Version")}</p>
    <p class="small">
      ${tr(
        "성실·용기·사랑·감사를 돌아보는 말씀입니다. 경기 승리나 성적을 보장하는 의미는 아닙니다. 앞뒤 문맥과 함께 읽어보세요.",
        "Reflect on diligence, courage, love and gratitude. Read in context, not as a promise of sporting success."
      )}
    </p>
    <a
      class="small"
      style="color:var(--muted)"
      href="https://github.com/thiagobodruk/bible"
      target="_blank"
      rel="noopener noreferrer"
    >${tr("본문 데이터 출처","Scripture data source")}</a>
  `;
}

/* 날짜가 바뀌면 작성 중인 일지를 건드리지 않고 말씀만 갱신 */
let lastWordDay = dayKey(new Date());

function checkNewDay() {
  const today = dayKey(new Date());
  if(today === lastWordDay) return;

  lastWordDay = today;
  $("todayLabel").textContent = new Date().toLocaleDateString(
    lang === "en" ? "en-GB" : lang
  );

  renderWord();
}

setInterval(checkNewDay,30000);

document.addEventListener("visibilitychange",() => {
  if(!document.hidden) checkNewDay();
});

/* =========================================
   백업 · 언어 전환
========================================= */

$("languageButton").onchange = event => {
  if(!canLeave()) { event.target.value = lang; return; }
  lang = event.target.value;
  render();
};

$("exportButton").onclick = () => {
  const blob = new Blob(
    [JSON.stringify(db,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "touchline-backup-"+dayKey(new Date())+".json";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url),1000);
};

$("importButton").onclick = () => {
  $("backupFile").click();
};

$("backupFile").onchange = async event => {
  const file = event.target.files[0];
  if(!file) return;

  try {
    if(file.size > 10000000) throw new Error("Too large");

    const incoming = JSON.parse(await file.text());

    if(!incoming ||
       incoming.version !== 1 ||
       !Array.isArray(incoming.sessions) ||
       !Array.isArray(incoming.matches)) {
      throw new Error("Invalid backup");
    }

    if(!canLeave()) return;

    if(!confirm(tr(
      "현재 기록 전체를 백업 파일의 내용으로 교체할까요?",
      "Replace all current records with this backup?"
    ))) return;

    db = normalize(incoming);

    if(save()) {
      render();
      notify(tr("백업을 가져왔습니다.","Backup imported."));
    }

  } catch(error) {
    notify(tr(
      "올바른 TOUCHLINE 백업 파일이 아닙니다.",
      "Invalid TOUCHLINE backup file."
    ));

  } finally {
    event.target.value = "";
  }
};

window.addEventListener("beforeunload",event => {
  if(dirty) {
    event.preventDefault();
    event.returnValue = "";
  }

  if(videoURL) URL.revokeObjectURL(videoURL);
});

/* 시작 */
render();
loadBible();
</script>
</body>
</html>
